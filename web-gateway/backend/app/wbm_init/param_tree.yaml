# =============================================================================
# WBM run-init parameter tree: the form schema of the gateway's model parameters
#
# Who reads it: the gateway backend, which serves the tree resolved for a draft's
# snapshot and validates a draft's custom_params (init key path -> value) against it.
# The toolkit never reads it (ADR 0038). The shape is
# docs/architecture/model-parameters.md; what WBM does with each value, as tested on Anvil
# and as read in its code, is docs/reference/wbm-init.md.
#
# One tree serves two WBM code versions, "22.1.1" and "23.9.0": the snapshot's
# metadata.json uses.modelCode.version picks one. `versions:` and every version-keyed
# map below are evaluated against it.
#
# Nodes
#   group   a section; has `children`. `wbm` on a group is the init block it holds
#   module  a group with its own on/off init key (a module card in the wizard)
#   key     a leaf; `wbm` is its init key path, the names of nested blocks joined by dots.
#           `key` is the field's name in this tree: cross_rules, show_if and required_if
#           refer to it, e.g. climate.pet_method
#
# Attributes
#   type      string | int | number | bool01 | date | enum   scalar fields: the component
#             list | dataset | file | block | column | flag  that renders the field is chosen
#             by `type`. A dataset is a data .init, a raster or a number (see `accepts`)
#   tier      basic     always shown
#             module    shown while its module is on
#             advanced  inside the collapsed "Advanced" disclosure
#             locked    set by the gateway or the toolkit; not shown
#             A node without `tier` takes its parent's; a top-level node has basic, and
#             the children of a module without a tier have module
#   editable  true         the wizard edits the value: `wbm` is set, type is number, int,
#                          enum, bool01, string or date, and the node is not locked,
#                          inert, write: never, ui_only or owned by a draft_field
#             switch_off   a module (or switch group) with on_if: key_present, which the
#                          wizard can switch off when the snapshot's init has it on
#             Dataset, file, column, list and block fields have no `editable`: they are
#             shown read-only. A module the init has off is switched on by the wizard when
#             everything its `required` children need can be given from the draft's model
#             input: a scalar at its default, a dataset that accepts `init` from the model
#             input's datasets, one that accepts `number` as its default constant. A
#             required file, column, list or raster, or a flag that needs files beside the
#             network, cannot be given, so the module is not offered
#   draft_field  the draft field that already owns this init key (a name in
#             JobParameters). The key is not a custom parameter; on a group it covers
#             every descendant
#   default   what WBM uses when the key is absent. A default that differs by code version
#             is a map {"23.9.0": x, "22.1.1": y}. default_from names the init key whose
#             value is the default when this key is absent
#   versions  the code versions that read the key (absent = both). A key outside them is
#             refused when it has a value (validation.version_gating)
#   unit, label, name, doc   display. `doc` is help text for the user, one or two sentences
#   options   the allowed values: a list, or a map value -> label
#   options_from   one-name-per-line files of allowed values per code version, relative to
#             this file (generated by web-gateway/backend/scripts/gen_output_vars.py); `#` lines are comments
#   options_available_if   an option is offered only where `availability` allows it
#   rejects   list values that are refused (empty, whitespace_only)
#   range     [lo, hi] the value must lie in; min and max are single bounds; ui_max is a
#             form guard only; calibration.range is a tuning hint the form shows, and
#             calibration.source says where the range comes from, shown with it
#   pattern, forms, n_values   per-version forms of a string value (Time_Series)
#   values_accepted   spellings WBM accepts for an option, mapped to the option
#   accepts   for dataset and file fields, the value kinds that work: init (a data .init),
#             number (a constant for every grid cell), raster (a GDAL file), file (a table
#             read directly). A kind is listed only where WBM accepts it and nothing later
#             breaks on it
#   required, required_if, show_if, requires, rule   conditions and checks written as short
#             text over field keys; module state is modules.<id>@enabled
#   empty_is_value   true when WBM tests the key with exists or defined, so an empty string
#             is a real value to WBM: the key is omitted, never written empty
#   write: never     the key is never written (the toolkit supplies it)
#   inert     WBM never reads the key; kept so that an init that carries it round-trips
#   ascii     the value must be ASCII
#   unit_contains   a dataset field: the text the chosen dataset's Units must contain. A map
#             when only one code version checks it
#   fit       a dataset field, or a module that is itself a dataset: what says which of the model
#             input's datasets fit it, for the wizard to offer when a module is switched on. `unit`
#             means the datasets whose unit is the field's `unit`. Without `fit` the tree does not
#             say which dataset fits, no dataset is offered, and a field that takes no number
#             keeps its module from being switched on
#   reads_first_file   a dataset field: WBM opens the first file of the dataset (the file of its
#             `Start_Date`) when it starts, to read the grid, whatever the run's dates. true; a map
#             of code version -> true where only some versions do; or the init path of a module,
#             where only a run with that module on does. The checks before a submit require that file
#   same_grid   a module, a map of code version -> init key paths of its dataset fields: that
#             version stops unless these datasets share one grid, which the gateway cannot read
#             yet, so the module is not switched on for that version
#   aliases   other keys WBM reads for the same setting; when the init has one, it wins
#   form: block_or_file   the key takes a block {...} or the path of an .init holding it
#   switch, on_if   a block that is on when its key holds a value: key_present is a value
#             that is not '', 0, '0', missing or an empty block; {output_match} and
#             {output_suffix} mean on when an Output_vars name matches
#   derived   a process with no init key: on when an output name matches its trigger
#   needs_output, suggested_outputs, unlocks_outputs, switch_off_removes_outputs,
#   requires_for_output, warn_unless, processes_triggered_by_names
#             how a module and the output list depend on each other
#   cli, value   a wbm.pl command-line option (not an init key), and a value the gateway sets
#   ui_only   a choice of the form that is not an init key (it picks which keys are shown)
#   source    where a list field takes its values from
#
# Top-level sections: `availability` (options a model input must support), `validation`
# (rules for every value), `tree`, `cross_rules` (checks across fields, each with an id).
# =============================================================================

schema_version: 1
code_versions: ["22.1.1", "23.9.0"]

# An option is offered only when the draft's model input has what WBM requires for it.
availability:
  drivers: "the model input has a dataset for each of MT_cloudFr, MT_windU, MT_windV and MT_humidity"
  options:
    - { option: "PET = Penman-Monteith", needs: [drivers, MT_albedo, canopyHt, MT_LAI] }
    - { option: "PET = FAO-56", needs: [drivers, MT_albedo] }
    - { option: "openWaterEvap = Calculate", needs: [drivers, Elevation] }
    - { option: "any *_twt output", needs: [drivers, airT_yc, canopyHt, MT_LAI] }

# Rules the validator applies to every value. `level` is shown with the message.
validation:
  unknown_keys: { level: error, rule: "a key, at the top level or inside a block, that is not in this tree for the target version; keys inside a source block FILE round-trip unchanged" }
  version_gating: { level: error, rule: "a field or module outside the target version has a value (Spinup.Save_Vars, a PET block and a daily[N] time series on 22.1.1); keys that 22.1.1 ignores silently (Aquifers, Springs, USGS, ncDouble, ExtraAqfCoeff) are dropped on read, never offered" }
  forbidden_keys: { level: error, rule: "FreeWaterEvap, MT_relHumidity and any key matching ^spinup_ (any case) abort WBM even when empty: refused, and removed from a source init on read" }
  locked: { level: error, rule: "a user-set value in a tier: locked field, or in an inert field, or in a field with write: never" }
  draft_field: { level: error, rule: "a custom parameter on a field that carries draft_field, or on a descendant of one: the draft's own field owns it" }
  landcover_lowercase: { level: warn, rule: "a lowercase landCover key: WBM ignores it; only LandCover is read" }
  reference_prefixes: { level: error, rule: "a dataset or file reference outside /wbm/data/, /wbm/data_init/ and /wbm/wbm_init/, or of a kind the field's accepts does not list" }
  ascii: { level: error, rule: "a non-ASCII byte in a written value, or in any file a 23.9.0 run reads" }
  numbers: { level: error, rule: "a number field whose value is not WBM's number form ^[-+]?\\d+(\\.\\d*)?([eE][-+]?\\d+(\\.\\d*)?)?$; a leading dot (.5) is not a number to WBM" }
  empty_values: { level: error, rule: "an empty string for a field that is not a module off-switch; for a field with empty_is_value: true an empty value is a real value to WBM, so the key is omitted, never written empty" }
  output_vars: { level: error, rule: "an Output_vars name that is not in the target version's option list, an empty list, or a whitespace-only list" }
  projection: { level: error, rule: "Projection is not exactly epsg:4326" }

tree:

  - group: run
    label: "Run setup"
    children:
      - { key: title, wbm: Comment, label: "Run description", type: string, tier: basic, editable: true, ascii: true,
          doc: "A free-text description of the run. ASCII characters only." }
      - { key: project, wbm: Project, label: "Project name", type: string, tier: basic, editable: true, ascii: true,
          doc: "A short project name, used in the output title. Defaults to 'My project'." }
      - { key: id, wbm: ID, type: string, tier: locked, pattern: "^[A-Za-z0-9_]+$", value: "{user}_{run_id}",
          doc: "The unique run ID: letters, digits and underscores, no spaces. Set by the gateway." }
      - group: period
        wbm: MT_Code_Name
        label: "Simulation period and output"
        children:
          - { key: start, wbm: MT_Code_Name.Run_Start, type: date, tier: basic, draft_field: temporal_range_start, required_if: "spinup.start is empty",
              doc: "First day of the run, YYYY-MM-DD; YYYY-MM-00 gives a monthly time series. Optional when a spin-up start is set." }
          - { key: end, wbm: MT_Code_Name.Run_End, type: date, tier: basic, draft_field: temporal_range_end, rule: "end > start; empty -> climate.air_temp.primary must be set (the airTmin/airTmax form is not enough)",
              doc: "Last day of the run. If empty, the run ends where the air temperature dataset ends." }
          - { key: time_series, wbm: MT_Code_Name.Time_Series, label: "Output time step", type: string, tier: advanced, editable: true, default: daily, pattern: {"22.1.1": "^(daily(\\{\\d+\\})?|monthly)$", "23.9.0": "^(daily(\\{\\d+\\})?|daily\\[\\d+(,\\d+)*(lastDay)?\\]|monthly)(:daily.*)?$"}, forms: {"22.1.1": [daily, "daily{N}", monthly], "23.9.0": [daily, "daily{N}", "daily[N]", "daily[N,...lastDay]", monthly, "<form>:daily..."]}, n_values: {"daily{N}": [1, 2, 3, 4, 6, 8, 12, 24]},
              doc: "Output time step: 'daily', 'daily{N}' for N sub-daily steps (N is 1, 2, 3, 4, 6, 8, 12 or 24), or 'monthly'. WBM 23.9.0 also accepts 'daily[N]' for a step of N days and a ':daily...' suffix for the run step. The default is monthly when the run start ends in -00, otherwise daily." }
          - { key: calendar, wbm: MT_Code_Name.Calendar, label: "Calendar", type: enum, tier: advanced, editable: true, default: standard, options: [standard, "366", "365"],
              doc: "'standard' is the 366-day calendar. The 360-day calendar is not offered because WBM cannot run it." }
          - { key: file_size, wbm: MT_Code_Name.File_Size, label: "Period per output file", type: enum, tier: advanced, editable: true, default: year, options: [year, month, day], rule: "forced to day for hourly runs; day is invalid with a monthly time series",
              doc: "How much of the run one output file holds." }
          - { key: run_title, wbm: MT_Code_Name.Run_Title, label: "Output title", type: string, tier: advanced, editable: true, ascii: true,
              doc: "Title written into the output. Defaults to 'WBM-TrANS, ' followed by the project name." }
          - { key: credits, wbm: MT_Code_Name.credits, type: string, tier: locked, empty_is_value: true, write: never,
              doc: "Never written: when present it overrides WBM's configured default." }
          - { key: mt_id, wbm: MT_Code_Name.MT_ID, tier: locked, empty_is_value: true, value: "{user}_{run_id}", rule: "no leading '/' and no backslash; an empty value stays empty and '_runoff' is appended" }
          - { key: output_dir, wbm: MT_Code_Name.Output_dir, tier: locked, required: true, value: "/wbm/wbm_output/{ID}/", rule: "absolute path; the toolkit rewrites it to the run's own output folder" }
          - { key: spool_dir, wbm: MT_Code_Name.spool_dir, tier: locked, empty_is_value: true, write: never,
              doc: "Never written: an empty value would send the spool to the root folder. The toolkit sets the spool folder." }
          - { key: run_state_dir, wbm: MT_Code_Name.run_state_dir, tier: locked, empty_is_value: true, write: never,
              doc: "Never written. The toolkit sets the run-state folder." }
          - { key: mt_file, wbm: MT_Code_Name.MT_file, tier: locked, empty_is_value: true, write: never,
              doc: "Never written." }
      - group: spinup
        wbm: Spinup
        label: Spin-up
        form: block_or_file
        doc: "Allowed keys: Start, End, Loops, State_ID, Force_ID_Date and, on WBM 23.9.0, Save_Vars. Always a nested block: flat spinup_* keys abort WBM."
        children:
          - { key: loops, wbm: Spinup.Loops, label: "Spin-up loops", type: int, tier: basic, editable: true, default: 0, min: 0, ui_max: 50,
              doc: "Number of spin-up loops; 0 means no spin-up. A non-number counts as 0." }
          - { key: start, wbm: Spinup.Start, label: "Spin-up start", type: date, tier: basic, editable: true, required_if: "loops > 0", show_if: "loops > 0",
              doc: "Start of the spin-up. The day is forced to the 1st." }
          - { key: end, wbm: Spinup.End, label: "Spin-up end", type: date, tier: basic, editable: true, required_if: "loops > 0", show_if: "loops > 0", rule: "spinup.end > spinup.start",
              doc: "End of the spin-up. The day is forced to the last day of its month." }
          - { key: save_vars, wbm: Spinup.Save_Vars, label: "Save spin-up aggregates", type: enum, tier: advanced, editable: true, versions: ["23.9.0"], default: 0, options: [0, 1, 2],
              doc: "1 saves monthly and yearly aggregates during spin-up, 2 yearly only, 0 none. WBM 22.1.1 aborts on the key, even with 0." }
          - { key: state_id, wbm: Spinup.State_ID, type: string, tier: locked,
              doc: "Run state to start from. Set by the gateway when it continues a previous run." }
          - { key: force_id_date, wbm: Spinup.Force_ID_Date, type: date, tier: locked,
              doc: "Overwrite the date in the run state files." }
      - group: run_options
        label: "Run options"
        tier: advanced
        children:
          - { key: verbose, type: bool01, tier: locked, cli: "-v", value: 1 }
          - { key: test, type: bool01, tier: locked, default: 0, cli: "-test",
              doc: "One time step, no output. A cheap first check, not a complete dry run." }
          - { key: threads, type: int, tier: locked, default: 4, max: 8, cli: "-t", value: "{slurm_cpus}",
              doc: "Number of threads; WBM clamps it to 8." }
          - { key: remove_output, type: bool01, default: 0, cli: "-rm",
              doc: "Remove and do not update existing output files." }
          - { key: no_state, type: bool01, default: 0, cli: "-noState",
              doc: "Do not read or write run state files." }
          - { key: daily_state, type: bool01, default: 0, cli: "-dState",
              doc: "Write daily run state files." }
          - { key: no_run, type: bool01, tier: locked, default: 0, cli: "-noRun",
              doc: "Initialise without running (used with -bldSpool)." }
          - { key: bld_spool, tier: locked, versions: ["23.9.0"], cli: "-bldSpool",
              doc: "N_FORKS [NC]: build the spool. Not allowed with -test or -noOutput." }
          - { key: no_state_id, type: bool01, tier: locked, versions: ["23.9.0"], default: 0, cli: "-noStateID" }
          - { key: bench_day, type: bool01, tier: locked, default: 0, cli: "-bd",
              doc: "Benchmark log per day." }
          - { key: bench_map, type: bool01, tier: locked, default: 0, cli: "-bm",
              doc: "Benchmark mapping log, <ID>.BM.log." }
          - { key: bench_year, type: bool01, tier: locked, versions: ["22.1.1"], default: 0, cli: "-by",
              doc: "WBM 22.1.1 only: 23.9.0 does not know the option and exits without running." }
          - { key: pdl_slicing, type: bool01, default: 0, cli: "-sl",
              doc: "Faster when using many crops." }
          - { key: save_dams, type: bool01, default: 0, cli: "-saveDams" }
          - { key: spool_dir, tier: locked, cli: "-spoolDir" }
          - { key: state_dir, tier: locked, cli: "-stateDir" }

  - group: domain
    label: "Model domain"
    children:
      - { key: network, wbm: Network, label: "River network", type: dataset, tier: basic, accepts: [raster], kind: flow_direction_raster, required: true,
          doc: "GDAL file that sets the grid, resolution and extent. The file extension is part of the name. A circular network aborts WBM." }
      - { key: projection, wbm: Projection, type: enum, tier: locked, default: "epsg:4326", options: ["epsg:4326"], required: true,
          doc: "Always the lowercase string 'epsg:4326'; any other spelling aborts WBM." }
      - { key: elevation, wbm: Elevation, label: "Grid elevation", type: dataset, tier: advanced, default: 0, unit: m, accepts: [init, number, raster],
          doc: "Elevation of the grid: used by Penman-Monteith and FAO-56 PET, by open-water 'Calculate' and to convert specific humidity. A constant 0 counts as missing where a layer is required, so give a non-zero constant or a layer." }

  - group: routing
    wbm: Routing
    label: "River routing"
    required: true
    children:
      - { key: method, wbm: Routing.method, label: "Routing method", type: enum, tier: basic, editable: true, default: LRR, options: [LRR, Muskingum, Flush], required: true,
          doc: "River routing method; Flush is flow accumulation. On WBM 22.1.1 Muskingum is replaced by LRR (with a warning) when inter-basin transfers, water demand, irrigation or open-water evaporation is on. Muskingum suits coarse grids only." }
      - { key: weighted_length, wbm: Routing.weightedLength, label: "Weighted reach length", type: enum, tier: advanced, editable: true, default: "No", options: ["Yes", "No"], show_if: "method == LRR",
          doc: "Weighted stream reach length in LRR routing. WBM reads any string without 'No' as yes, so only 'Yes' and 'No' are offered." }
      - { key: velocity_method, wbm: Routing.velMethod, label: "Stream velocity method", type: enum, tier: advanced, editable: true, default: Constant, options: [Constant, AASH],
          doc: "Stream velocity: constant, or at-a-site hydraulics." }
      - { key: velocity, wbm: Routing.velocity, label: "Stream velocity", type: number, tier: advanced, editable: true, default: 2.18, unit: km/h, calibration: {range: [1, 3], source: "Grogan et al. 2022, Table 1"}, show_if: "velocity_method == Constant",
          doc: "Stream velocity at 30 arc-minute resolution. WBM rescales it to the cell size of the network, so the velocity in use is higher on finer grids." }
      - { key: beta, wbm: Routing.beta, label: "Muskingum shape parameter", type: number, tier: advanced, editable: true, default: 2, show_if: "method == Muskingum",
          doc: "Shape parameter sigma of Muskingum routing." }
      - { key: slope, wbm: Routing.slope, label: "Riverbed slope", type: number, tier: advanced, editable: true, default: 0.0001, unit: "m/m (0.1 m/km)", show_if: "method == Muskingum",
          doc: "Bed slope S0 in the Muskingum coefficients. Enter it in m/m: the default 0.0001 is the manual's 0.1 m/km." }
      - group: stream_geometry
        label: "Stream geometry"
        tier: advanced
        children:
          - { key: eta, wbm: Routing.eta, label: "Depth coefficient", type: number, editable: true, default: 0.25, calibration: {range: [0.1, 0.33], source: "Grogan et al. 2022, Table 1"},
              doc: "Depth = eta × Q^nu, Q being the long-term mean discharge (Park 1977)." }
          - { key: nu, wbm: Routing.nu, label: "Depth exponent", type: number, editable: true, default: 0.4, calibration: {range: [0.1, 0.5], source: "Grogan et al. 2022, Table 1"},
              doc: "The exponent nu of depth = eta × Q^nu." }
          - { key: tau, wbm: Routing.tau, label: "Width coefficient", type: number, editable: true, default: 8, calibration: {range: [3.7, 10], source: "Grogan et al. 2022, Table 1"},
              doc: "Width = tau × Q^phi, Q being the long-term mean discharge (Park 1977)." }
          - { key: phi, wbm: Routing.phi, label: "Width exponent", type: number, editable: true, default: 0.58, calibration: {range: [0.2, 0.7], source: "Grogan et al. 2022, Table 1"},
              doc: "The exponent phi of width = tau × Q^phi." }
          - { key: aas_b, wbm: Routing.aas_b, label: "At-a-site width exponent", type: number, editable: true, default: 0.1, calibration: {range: [0, 0.25], source: "Grogan et al. 2022, Table 1"}, show_if: "velocity_method == AASH",
              doc: "How width changes with discharge at a site (Leopold and Maddock 1953). f and m follow from b (b+f+m=1, b+f=m); delta and epsilon from eta, tau, nu and phi." }

  - group: climate
    label: "Climate forcing"
    children:
      - key: precip
        label: "Precipitation"
        wbm: MT_Precip
        type: block
        tier: basic
        unit: "mm/(hour|day|month)"
        required: true
        children:
          - { key: primary, wbm: MT_Precip.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true,
              doc: "Precipitation dataset, a data .init file. Units must start mm/m (monthly), mm/d or mm/h; the series must be at least monthly." }
          - { key: secondary, wbm: MT_Precip.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init] }
          - { key: scale, wbm: MT_Precip.Scale, label: "Precipitation scale factor", type: number, tier: advanced, editable: true, default: 1, min: 0,
              doc: "Scale factor (1.1 adds 10%)." }
      - { key: precip_fraction, wbm: precipFraction, label: "Precipitation fraction", type: dataset, tier: advanced, unit: fraction, accepts: [init], required_if: "precip.primary Time_Series is monthly", rule: "must be empty (omitted) when precipitation is daily: a non-empty value is fatal; Units must start 'frac'",
          doc: "Daily fraction of monthly precipitation. Required when precipitation is monthly; absent when it is daily." }
      - key: air_temp
        label: "Air temperature"
        wbm: MT_airT
        type: block
        tier: basic
        unit: C
        required: true
        children:
          - { key: input_form, type: enum, default: mean, options: [mean, min_max], ui_only: true,
              doc: "Daily mean temperature, or minimum and maximum temperature to be averaged." }
          - { key: primary, wbm: MT_airT.Primary, label: "Mean temperature dataset", type: dataset, reads_first_file: lapseDownscale, accepts: [init], required_if: "input_form == mean", show_if: "input_form == mean", empty_is_value: true,
              doc: "Mean air temperature dataset. Omitted, never empty, in the minimum/maximum form." }
          - { key: secondary, wbm: MT_airT.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], show_if: "input_form == mean" }
          - { key: air_t_min, wbm: MT_airT.airTmin, label: "Minimum temperature dataset", type: dataset, accepts: [init], required_if: "input_form == min_max", show_if: "input_form == min_max" }
          - { key: air_t_max, wbm: MT_airT.airTmax, label: "Maximum temperature dataset", type: dataset, accepts: [init], required_if: "input_form == min_max", show_if: "input_form == min_max" }
      - { key: pet_method, wbm: PET, label: "PET method", type: enum, tier: basic, editable: true, default: Hamon, options: [Hamon, Penman-Monteith, FAO-56], options_available_if: availability,
          doc: "Potential evapotranspiration method. Penman-Monteith and FAO-56 need wind, humidity, cloud fraction and albedo datasets; Penman-Monteith also needs leaf area index and canopy height." }
      - { key: pet_scale, wbm: PET.Scale, label: "PET scale factor", type: number, tier: advanced, editable: true, versions: ["23.9.0"], default: 1,
          doc: "Multiplies land-cover PET. WBM 23.9.0 only: 22.1.1 aborts on a PET block." }
      - group: extra_drivers
        label: "Additional climate drivers"
        tier: module
        show_if: "pet_method in [Penman-Monteith, FAO-56] or any output name ends with _twt"
        doc: "Needed for Penman-Monteith and FAO-56 PET and for water temperature (_twt outputs)."
        children:
          - key: wind_u
            label: "Wind speed U (east-west)"
            wbm: MT_windU
            type: block
            unit: m/s
            required_if: "pet_method in [Penman-Monteith, FAO-56] or any output ends with _twt"
            children:
              - { key: primary, wbm: MT_windU.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true }
              - { key: secondary, wbm: MT_windU.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], rule: "same Time_Series and Units as primary",
                  doc: "Fills nodata cells of the primary dataset." }
          - key: wind_v
            label: "Wind speed V (north-south)"
            wbm: MT_windV
            type: block
            unit: m/s
            required_if: "pet_method in [Penman-Monteith, FAO-56] or any output ends with _twt"
            children:
              - { key: primary, wbm: MT_windV.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true }
              - { key: secondary, wbm: MT_windV.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], rule: "same Time_Series and Units as primary",
                  doc: "Fills nodata cells of the primary dataset." }
          - key: humidity
            label: "Humidity"
            wbm: MT_humidity
            type: block
            unit: "% | kg/kg | C"
            required_if: "pet_method in [Penman-Monteith, FAO-56] or any output ends with _twt"
            doc: "Relative humidity (%), specific humidity (kg/kg) or dew point (C). Kg/kg needs a non-zero elevation."
            children:
              - { key: primary, wbm: MT_humidity.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true }
              - { key: secondary, wbm: MT_humidity.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], rule: "same Time_Series and Units as primary",
                  doc: "Fills nodata cells of the primary dataset." }
          - key: cloud_fraction
            label: "Cloud fraction"
            wbm: MT_cloudFr
            type: block
            unit: fraction
            required_if: "pet_method in [Penman-Monteith, FAO-56] or any output ends with _twt"
            children:
              - { key: primary, wbm: MT_cloudFr.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true }
              - { key: secondary, wbm: MT_cloudFr.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], rule: "same Time_Series and Units as primary",
                  doc: "Fills nodata cells of the primary dataset." }
          - key: albedo
            label: "Albedo"
            wbm: MT_albedo
            type: block
            unit: fraction
            required_if: "pet_method in [Penman-Monteith, FAO-56]"
            show_if: "pet_method in [Penman-Monteith, FAO-56]"
            doc: "Daylight average."
            children:
              - { key: primary, wbm: MT_albedo.Primary, label: "Primary dataset", type: dataset, accepts: [init], required: true }
              - { key: secondary, wbm: MT_albedo.Secondary, label: "Secondary dataset", type: dataset, tier: advanced, accepts: [init], rule: "same Time_Series and Units as primary",
                  doc: "Fills nodata cells of the primary dataset." }
      - { key: airT_yearly_clim, wbm: airT_yc, label: "Mean annual air temperature", type: dataset, tier: advanced, unit: C, accepts: [init, number, raster], required_if: "any output name ends with _twt",
          doc: "Mean annual 2 m air temperature: the base temperature of the water-temperature model, and a proxy for deep groundwater temperature." }
      - group: lapse_downscale
        wbm: lapseDownscale
        label: "Temperature downscaling by lapse rate"
        tier: advanced
        editable: switch_off
        requires: ["climate.air_temp.input_form == mean"]
        form: block_or_file
        switch: true
        on_if: key_present
        children:
          - { key: clim_elevation, wbm: lapseDownscale.climElevation, label: "Climate-driver elevation", type: dataset, unit: m, reads_first_file: true, accepts: [init, raster], required: true,
              doc: "Elevation of the climate drivers, a data .init or raster. A constant aborts WBM. A geopotential layer needs Var_Scale 0.1019716 in its data .init." }
          - { key: net_elevation, wbm: lapseDownscale.netElevation, label: "Network elevation", type: dataset, unit: m, reads_first_file: true, accepts: [init, raster], required: true,
              doc: "Elevation of the river network grid, a data .init or raster. A constant aborts WBM." }
          - { key: lapse_rate, wbm: lapseDownscale.lapseRate, label: "Lapse rate", type: number, editable: true, default: -6.49, unit: C/km, calibration: {range: [-8, -6], source: "Grogan et al. 2022, Table 1"},
              doc: "Temperature lapse rate, used only when it is a number." }
          - { key: force_sec_temp, wbm: lapseDownscale.forceSecTemp, label: "Allow secondary temperature", type: bool01, editable: true, default: 0,
              doc: "Allow downscaling when a Secondary air temperature dataset is used; otherwise WBM aborts." }
      - group: bias_correction
        label: "Climate bias correction"
        tier: advanced
        doc: "Each modelled/observed pair needs both members; a lone member is silently ignored. Datasets must be daily or monthly climatologies."
        children:
          - { key: mod_precip, wbm: WM_mod_precip, label: "Modeled precipitation", type: dataset, unit: "mm/day | mm/month", accepts: [init], required_if: obs_precip,
              doc: "Modeled precipitation within reference years." }
          - { key: obs_precip, wbm: WM_obs_precip, label: "Pseudo-observed precipitation", type: dataset, accepts: [init], required_if: mod_precip,
              doc: "Pseudo-observed precipitation within reference years. WBM subtracts modeled minus pseudo-observed, day by day or month by month, from the precipitation of the run and clips the result at 0." }
          - { key: mod_airT, wbm: WM_mod_airT, label: "Modeled air temperature", type: dataset, unit: C, accepts: [init], required_if: obs_airT }
          - { key: obs_airT, wbm: WM_obs_airT, label: "Pseudo-observed air temperature", type: dataset, accepts: [init], required_if: mod_airT,
              doc: "WBM subtracts modeled minus pseudo-observed, day by day or month by month, from the air temperature of the run." }

  - group: land
    label: "Soil and land surface"
    children:
      - key: soil_water
        label: "Soil water"
        type: block
        tier: basic
        ui_only: true
        children:
          - { key: input_form, type: enum, default: awc, options: [awc, fc_wp], ui_only: true,
              doc: "If soilAWCapacity is given, FieldCap and WiltingPoint are not read." }
          - { key: soil_awc, wbm: soilAWCapacity, label: "Available water capacity", type: dataset, unit: mm/m, accepts: [init, raster], required_if: "input_form == awc", show_if: "input_form == awc",
              doc: "Available water capacity, a data .init or raster. A constant aborts WBM." }
          - { key: field_capacity, wbm: FieldCap, label: "Field capacity", type: dataset, unit: fraction, accepts: [init, number, raster], required_if: "input_form == fc_wp", show_if: "input_form == fc_wp", rule: "FieldCap and WiltingPoint must not both be numbers" }
          - { key: wilting_point, wbm: WiltingPoint, label: "Wilting point", type: dataset, unit: fraction, accepts: [init, number, raster], required_if: "input_form == fc_wp", show_if: "input_form == fc_wp" }
      - { key: rooting_depth, wbm: rootingDepth, label: "Rooting depth", type: dataset, tier: basic, unit: mm, accepts: [init, number, raster], required: true,
          doc: "Rooting depth. A constant works." }
      - { key: land_collapse, wbm: landCollapse, label: "Land cover aggregation", type: enum, tier: advanced, editable: true, options: ["", average, dominant], values_accepted: {avg: average, one: dominant}, show_if: "modules.land_cover_et@enabled or modules.irrigated_crops@enabled",
          doc: "Empty uses all land covers or crops, 'average' averages them, 'dominant' uses the dominant type of each cell. Read only together with LandCover or Irrigation." }
      - { key: canopy_height, wbm: canopyHt, label: "Canopy height", type: dataset, tier: advanced, unit: m, accepts: [init, raster], required_if: "climate.pet_method == Penman-Monteith or any output name ends with _twt",
          doc: "Canopy height, a data .init or raster. A constant aborts WBM." }

  - group: hydrology_params
    wbm: wbmParam
    label: "WBM parameters (wbmParam)"
    tier: advanced
    form: block_or_file
    children:
      - group: soil_runoff
        label: "Soil moisture and runoff"
        children:
          - { key: alpha, wbm: wbmParam.alpha, label: "Soil moisture drying coefficient", type: number, editable: true, default: 5, calibration: {range: [2, 20], source: "Grogan et al. 2022, Table 1"},
              doc: "How fast evapotranspiration falls as the soil dries: a larger alpha keeps it near PET until the soil is drier. 5 matches the drying curve of Pierce (1958)." }
          - { key: infiltration, wbm: wbmParam.Infiltration, label: "Infiltration method", type: enum, editable: true, default: FrAMES, options: [FrAMES, HBV],
              doc: "FrAMES or HBV. Anything that does not match HBV behaves as FrAMES." }
          - { key: infiltr_frac, wbm: wbmParam.infiltrFrac, label: "Groundwater infiltration fraction", type: dataset, default: 0.5, range: [0, 1], calibration: {range: [0.1, 0.9], source: "Grogan et al. 2022, Table 1"}, accepts: [init, number, raster],
              doc: "Share of the water draining from the soil that recharges shallow groundwater; the rest becomes surface runoff. Results are generally robust between 0.4 and 0.6." }
          - { key: hbv_beta, wbm: wbmParam.HBV_Beta, label: "HBV recharge factor", type: number, editable: true, default: 60, show_if: "infiltration == HBV",
              doc: "Direct infiltration recharge factor for HBV." }
          - { key: gw_beta, wbm: wbmParam.groundWatBETA, label: "Baseflow release coefficient", type: dataset, default: 0.0167, unit: "1/day", calibration: {range: [0.001, 0.1], source: "Grogan et al. 2022, Table 1"}, accepts: [init, number, raster],
              doc: "Share of shallow groundwater released to the river as baseflow each day (baseflow = coefficient × storage). 0.0167 is a 60-day time scale." }
          - { key: rhrt2, wbm: wbmParam.RhRt2, label: "Runoff storage release coefficient", type: dataset, default: {"23.9.0": 0.2, "22.1.1": 0.56}, calibration: {range: [0.2, 1.0], source: "Grogan et al. 2022, Table 1"}, accepts: [init, number, raster],
              doc: "Release coefficient of the surface runoff retention pool, which drains at RhRt2 × √(2 g storage): a larger value gives a quicker response. The default differs by version: 0.56 on WBM 22.1.1, 0.2 on 23.9.0. The same coefficient drives the irrigation pool." }
          - { key: max_rff_storage, wbm: wbmParam.maxRffStorage, label: "Runoff storage limit", type: number, editable: true, default: 1000, unit: mm,
              doc: "Storage limit of the surface runoff retention pool; water above it goes straight to the river. 1000 mm means practically no limit; 15 to 50 mm gives a flashier storm response in temperate climates." }
      - group: vegetation_evaporation
        label: "Vegetation and evaporation"
        children:
          - { key: c_leaf_max, wbm: wbmParam.CLeafMax, label: "Maximum stomatal conductance", type: dataset, default: 6, unit: mm/s, accepts: [init, number, raster], show_if: "climate.pet_method in [Penman-Monteith, FAO-56]",
              doc: "Maximum leaf stomatal conductance, in mm/s." }
          - { key: intercept_par, wbm: wbmParam.InterceptPar, label: "Canopy interception coefficient", type: number, editable: true, default: 0.2, unit: mm, calibration: {range: [0, 1], source: "Grogan et al. 2022, Table 1"},
              doc: "Canopy water storage capacity per unit of leaf area index: capacity = coefficient × LAI. Typical values are 0.15 to 0.25 mm." }
          - { key: open_water_coeff, wbm: wbmParam.openWtrCoeff, label: "Open-water evaporation coefficient", type: number, editable: true, default: 1,
              doc: "Open-water evaporation as a multiple of PET, used when no openWaterEvap dataset is given." }
          - { key: irr_gamma, wbm: wbmParam.irrGm, label: "Soil moisture gamma (irrigation)", type: bool01, editable: true, default: 0,
              doc: "Soil moisture gamma function for irrigated crops." }
      - group: endorheic_basins
        label: "Endorheic basins"
        children:
          - { key: endorheic_dir, wbm: wbmParam.endorheicDir, label: "Endorheic flow direction", type: bool01, editable: true, default: 0,
              doc: "Use endorheic flow direction (-1) in the network; disables the next four options." }
          - { key: exorheic_coast, wbm: wbmParam.exorheicCoast, label: "Coastal outlet segmentation", type: bool01, editable: true, default: 1, show_if: "endorheic_dir == 0",
              doc: "On: river mouths in a connected group of mouths (also diagonally) that reaches the edge of the network count as coastal (exorheic), never as endorheic. WBM reads it only when endorheic flow direction is off." }
          - { key: endorheic_buffer, wbm: wbmParam.endorheicBuffer, label: "Endorheic exclusion buffer", type: number, editable: true, default: 0, unit: km, show_if: "endorheic_dir == 0",
              doc: "A river mouth with cells outside the network, or ocean cells of the ocean mask, within this distance (a square window) counts as exorheic, not endorheic. WBM rounds the distance down to whole cells, at least one cell. WBM reads it only when endorheic flow direction is off." }
          - { key: ocean_mask, wbm: wbmParam.oceanMask_file, label: "Ocean mask", type: dataset, accepts: [raster], show_if: "endorheic_dir == 0",
              doc: "GDAL raster only." }
          - { key: endorheic_mask, wbm: wbmParam.endorheicMask, label: "Endorheic mask", type: dataset, accepts: [init, raster], show_if: "endorheic_dir == 0" }
          - { key: save_endorheic_mask, wbm: wbmParam.saveEndorhMask, label: "Save endorheic mask", type: bool01, editable: true, default: 0 }
      - group: tracking_output
        label: "Tracking and output"
        children:
          - { key: comp_balance, wbm: wbmParam.compBalance, label: "Component balance spreadsheets", type: bool01, editable: true, default: 0, show_if: "any output name ends with _pg|_ps|_pr|_pu or _pst|_irr|_use|_rlt",
              doc: "Write the tracking component balance as spreadsheets to the output folder. WBM forces it to 0 unless a primary-source or irrigation re-use component is on, and to 1 for some irrigation re-use outputs." }
          - { key: reset_spinup_tracking, wbm: wbmParam.resetSpinupTracking, label: "Reset tracking after spin-up", type: bool01, editable: true, default: 0,
              doc: "Restart tracking after spin-up: 0 keeps representative mixtures, 1 accumulates a component flux during the run." }
          - { key: n_irr_tracking, wbm: wbmParam.nIrrTracking, label: "Irrigation re-use cycles", type: int, editable: true, default: 1,
              doc: "Number of irrigation water re-use cycles tracked. With more than 1, WBM adds <var>_irr_<k> itself for every listed *_irr variable: do not list those names." }
          - { key: output_scale, wbm: wbmParam.outputScale, label: "Output scaling", type: enum, editable: true, default: Cell, options: [Cell, None],
              doc: "'Cell' scales output per cell; anything else turns scaling off." }
          - { key: nc4, wbm: wbmParam.NC4, label: "Compressed NetCDF output", type: bool01, editable: true, default: 1,
              doc: "0 writes uncompressed classic NetCDF." }
          - { key: nc_double, wbm: wbmParam.ncDouble, label: "Double-precision NetCDF", type: bool01, editable: true, versions: ["23.9.0"], default: 0,
              doc: "Double precision NetCDF. WBM 23.9.0 only: 22.1.1 ignores the key." }
          - { key: screen_print_scale, wbm: wbmParam.scrPrintScale, type: number, tier: locked, default: 1,
              doc: "Units of the on-screen balances relative to km3 (0.001 for small networks)." }

  - group: modules
    label: Modules
    children:
      - module: inter_basin_transfers
        wbm: ConnectivityNetwork
        name: "Inter-basin transfers"
        tier: advanced
        editable: switch_off
        form: block_or_file
        on_if: key_present
        children:
          - { key: file, wbm: ConnectivityNetwork.File, label: "Transfer file", type: file, accepts: [file], required: true,
              doc: "Spreadsheet of inter-basin transfers. Must exist." }
          - { key: skip_lines, wbm: ConnectivityNetwork.SkipLines, label: "Header lines to skip", type: int, editable: true, default: 0, required: true,
              doc: "Header lines to skip. Required: always written." }
          - group: columns
            label: "Transfer file columns"
            doc: "Column names in the transfer file."
            children:
              - { key: id, wbm: ConnectivityNetwork.ID, label: "ID column", type: column, required: true }
              - { key: use, wbm: ConnectivityNetwork.Use, label: "Use column", type: column,
                  doc: "Rows with an empty value in this column are skipped." }
              - { key: from_lon, wbm: ConnectivityNetwork.FromLon, label: "From-longitude column", type: column, unit: DD, required: true }
              - { key: from_lat, wbm: ConnectivityNetwork.FromLat, label: "From-latitude column", type: column, unit: DD, required: true }
              - { key: to_lon, wbm: ConnectivityNetwork.ToLon, label: "To-longitude column", type: column, unit: DD, required: true }
              - { key: to_lat, wbm: ConnectivityNetwork.ToLat, label: "To-latitude column", type: column, unit: DD, required: true }
              - { key: transfer_len, wbm: ConnectivityNetwork.TransferLen, label: "Transfer length column", type: column, unit: km }
              - { key: percent_flow, wbm: ConnectivityNetwork.PercentFlow, label: "Percent flow column", type: column }
              - { key: min_flow, wbm: ConnectivityNetwork.MinFlow, label: "Minimum flow column", type: column, unit: m3/s }
              - { key: max_flow, wbm: ConnectivityNetwork.MaxFlow, label: "Maximum flow column", type: column, unit: m3/s }
              - { key: start_year, wbm: ConnectivityNetwork.StartYear, label: "Start year column", type: column }
              - { key: end_year, wbm: ConnectivityNetwork.EndYear, label: "End year column", type: column }
          - { key: speculative, wbm: ConnectivityNetwork.Speculative, label: "Use speculative transfers", type: bool01, editable: true, default: 0,
              doc: "A flag, not a column name: 1 also uses the rows whose 'Speculative' column is non-empty." }
          - { key: lock_year, wbm: ConnectivityNetwork.Lock_Year, label: "Transfer lock year", type: int, editable: true,
              doc: "Fix transfer operations to this year." }
      - module: reservoirs
        wbm: Reservoirs
        name: Reservoirs
        editable: switch_off
        form: block_or_file
        on_if: key_present
        doc: "Every published snapshot uses the file form: a block file in the model input. A block file keeps its unknown keys (Comment, Author, Citation, URL, DOI) unchanged."
        children:
          - { key: file, wbm: Reservoirs.File, label: "Reservoir file", type: file, accepts: [file], required: true,
              doc: "Spreadsheet of reservoirs. Must exist. The optional columns ForceTo_Lon and ForceTo_Lat force a reservoir onto the network." }
          - { key: skip_lines, wbm: Reservoirs.SkipLines, label: "Header lines to skip", type: int, editable: true, default: 0, required: true,
              doc: "Header lines to skip. Required: always written." }
          - group: columns
            label: "Reservoir file columns"
            doc: "Column names in the reservoir file."
            children:
              - { key: id, wbm: Reservoirs.ID, label: "ID column", type: column, required: true }
              - { key: lon, wbm: Reservoirs.Lon, label: "Longitude column", type: column, unit: DD, required: true }
              - { key: lat, wbm: Reservoirs.Lat, label: "Latitude column", type: column, unit: DD, required: true }
              - { key: catch_area, wbm: Reservoirs.CatchArea, label: "Catchment area column", type: column, unit: km2,
                  doc: "Give CatchArea, Capacity and Area together." }
              - { key: capacity, wbm: Reservoirs.Capacity, label: "Capacity column", type: column, unit: "mln m3",
                  doc: "Effective storage, dead storage excluded." }
              - { key: area, wbm: Reservoirs.Area, label: "Area column", type: column }
              - { key: start_year, wbm: Reservoirs.StartYear, label: "Start year column", type: column,
                  doc: "A missing value defaults to 0 on WBM 23.9.0 only." }
              - { key: end_year, wbm: Reservoirs.EndYear, label: "End year column", type: column }
              - { key: purpose, wbm: Reservoirs.Purpose, label: "Purpose column", type: column }
          - { key: search_dist, wbm: Reservoirs.search_dist, label: "Search distance", type: number, editable: true, default: 5, unit: km,
              doc: "Search distance for matching upstream area to the network." }
          - { key: search_tolerance, wbm: Reservoirs.search_tolerance, label: "Catchment area tolerance", type: number, editable: true, default: 0.4,
              doc: "Tolerance to catchment area mismatch." }
          - { key: irr_frequency, wbm: Reservoirs.IrrFrequency, label: "Irrigation demand frequency", type: dataset, tier: advanced, accepts: [init],
              doc: "Data .init (Merra_irrigationGross_Freq_dc.init)." }
          - { key: small_reservoirs, wbm: Reservoirs.smReservoirFile, label: "Small reservoir capacity", type: dataset, tier: advanced, unit: m3/km2, accepts: [raster],
              doc: "Small irrigation reservoir capacity." }
          - { key: dam_use_params, wbm: Reservoirs.damUseParams, label: "Dam parameters by use", type: file, tier: advanced, accepts: [file],
              doc: "Operating parameters by dam use (6 rows, 8 or 9 columns)." }
          - { key: dam_custom_params, wbm: Reservoirs.damCusParams, label: "Dam parameters by dam ID", type: file, tier: advanced, accepts: [file],
              doc: "Custom operating parameters by dam ID; needs a column named Dam_ID." }
          - { key: obs_outflow_dir, wbm: Reservoirs.damObsOutflowDir, label: "Observed dam outflow folder", type: file, tier: advanced, accepts: [file],
              doc: "Folder of observed dam discharge files (*.csv with the columns DateTime and Q_out_m3d)." }
          - { key: lock_year, wbm: Reservoirs.Lock_Year, label: "Dam lock year", type: int, tier: advanced, editable: true,
              doc: "Use the dams that are active in this year for every date of the run: a dam counts as active when its start year is before this year and its end year after it (no end year counts as after). Other dams are dropped. Without it, each dam is used from its start year to its end year." }
      - { module: open_water_evaporation, wbm: openWaterEvap, name: "Evaporation from Open Water", type: dataset, tier: advanced, editable: switch_off, unit: mm/day, accepts: [init], on_if: key_present,
          doc: "Absent: open-water evaporation is the open-water coefficient times PET. A data .init supplies a dataset. 'Calculate' needs the cloud, wind and humidity drivers and is not offered; a number is read as a Magic-Table ID and aborts. On WBM 22.1.1 a present openWaterEvap makes Muskingum fall back to LRR." }
      - module: open_water_flush_routing
        wbm: openWater
        name: "Open Water flush routing"
        tier: advanced
        editable: switch_off
        form: block_or_file
        on_if: key_present
        doc: "Static or time series. MaskDataset is required whenever the block is on."
        children:
          - { key: mask, wbm: openWater.MaskDataset, label: "Land-cover index data", type: dataset, accepts: [init, raster], required: true,
              doc: "Land-cover index data. A time series is read as a dataset, a static layer as a layer." }
          - { key: mask_value, wbm: openWater.openWaterMaskValue, label: "Open-water index value", type: number, editable: true, default: 0,
              doc: "Open-water index value in the land-cover data." }
          - { key: fraction, wbm: openWater.fracOpenWater, label: "Open-water fraction", type: dataset, tier: advanced, unit: fraction, accepts: [init, number, raster], rule: "a time-series init is not offered until WBM's handling of it is confirmed (warn)",
              doc: "Optional additional layer of open-water fraction." }
      - module: glaciated_area_runoff
        wbm: Glaciers
        name: "Runoff from Glaciated Areas"
        editable: switch_off
        form: block_or_file
        on_if: key_present
        unlocks_outputs: [glMelt, glArea, glVolume]
        same_grid: {"23.9.0": [Glaciers.glMelt, Glaciers.glArea, Glaciers.glVolume]}
        doc: "WBM has no glacier module: it reads rasterized glacier area and glacier runoff."
        children:
          - { key: melt, wbm: Glaciers.glMelt, label: "Glacier melt discharge", type: dataset, unit: m3/s, fit: unit, reads_first_file: true, accepts: [init], required: true,
              doc: "Monthly discharge per glacier outlet. Its resolution must match glArea." }
          - { key: area, wbm: Glaciers.glArea, label: "Glacier area fraction", type: dataset, unit: fraction, fit: unit, unit_contains: {"23.9.0": frac}, reads_first_file: {"23.9.0": true}, accepts: [init], required: true,
              doc: "Glacier area fraction. Its Units must contain 'frac' on WBM 23.9.0." }
          - { key: volume, wbm: Glaciers.glVolume, label: "Glacier water volume", type: dataset, unit: m3/pixel, fit: unit, reads_first_file: true, accepts: [init], empty_is_value: true,
              doc: "Optional, and only needed for total water mass per pixel. Omitted when empty, never ''." }
      - module: groundwater_3d
        wbm: Aquifers
        name: "3D Groundwater Modeling"
        tier: advanced
        editable: switch_off
        versions: ["23.9.0"]
        form: block_or_file
        on_if: key_present
        doc: "WBM 23.9.0 only: 22.1.1 ignores the block. Aquifers need a long spin-up to equilibrate."
        children:
          - { key: type, wbm: Aquifers.Type, label: "Aquifer type", type: enum, editable: true, options: [Virtual, Lumped, ModFlow], required: true,
              doc: "ModFlow is matched exactly." }
          - { key: gwt_use_coeff, wbm: Aquifers.gwtUseCoeff, label: "Shallow groundwater use share", type: number, editable: true, default: 1, range: [0, 1],
              doc: "Share of shallow groundwater used before the aquifer is tapped." }
          - { key: infilt_fr, wbm: Aquifers.aqfInfiltFr, label: "Aquifer infiltration fraction", type: dataset, default: 0.5, unit: fraction, accepts: [init, number, raster], empty_is_value: true }
          - group: virtual_lumped
            label: "Virtual and lumped aquifers"
            show_if: "type in [Virtual, Lumped]"
            children:
              - { key: par_file, wbm: Aquifers.Aqf_Par_File, label: "Aquifer parameter file", type: file, accepts: [file], required: true,
                  doc: "CSV with the headers ID, Capacity (m3, optional), Sy, InfiltFrac, and Thickness and BaseElev (Lumped). Without Aqf_ID_File all cells are aquifer 1 and the file must contain ID 1." }
              - { key: id_file, wbm: Aquifers.Aqf_ID_File, label: "Aquifer ID map", type: dataset, accepts: [init, raster],
                  doc: "Optional; a plain path (no NETCDF: form). Ignored for ModFlow when Aqf_Clump is on." }
          - group: modflow
            label: "ModFlow inputs"
            show_if: "type == ModFlow"
            doc: "DEM, Net_DEM and Aqf_Thick are required and cannot be constants. DEFAULT datasets are not offered."
            children:
              - { key: dem, wbm: Aquifers.DEM, label: "Land surface elevation", type: dataset, unit: m, accepts: [init, raster], required: true }
              - { key: net_dem, wbm: Aquifers.Net_DEM, label: "Stream network elevation", type: dataset, unit: m, accepts: [init, raster], required: true }
              - { key: thickness, wbm: Aquifers.Aqf_Thick, label: "Aquifer thickness", type: dataset, unit: m, accepts: [init, raster], required: true }
              - { key: conf_thick, wbm: Aquifers.Conf_Thick, label: "Confining layer thickness", type: dataset, default: 0, unit: m, accepts: [init, number, raster], empty_is_value: true,
                  doc: "Thickness of the confining (top) layer; 0 means no confining layer." }
              - { key: head_top, wbm: Aquifers.H_DEM_T, label: "Top-layer head elevation", type: dataset, accepts: [init, raster], rule: "mutually exclusive with head_depth_top (both for the same layer is fatal); no constant",
                  doc: "Head elevation above sea level of the top layer; defaults to Net_DEM." }
              - { key: head_bottom, wbm: Aquifers.H_DEM_B, label: "Bottom-layer head elevation", type: dataset, accepts: [init, raster], rule: "mutually exclusive with head_depth_bottom; no constant",
                  doc: "Head elevation above sea level of the bottom layer; defaults to Net_DEM." }
              - { key: head_depth_top, wbm: Aquifers.H_DEPTH_T, label: "Top-layer head depth", type: dataset, unit: m, accepts: [init, number, raster], rule: "mutually exclusive with head_top",
                  doc: "Head depth below the DEM: head = DEM + value." }
              - { key: head_depth_bottom, wbm: Aquifers.H_DEPTH_B, label: "Bottom-layer head depth", type: dataset, unit: m, accepts: [init, number, raster], rule: "mutually exclusive with head_bottom" }
              - { key: sy, wbm: Aquifers.Aqf_Sy, label: "Specific yield", type: dataset, default: 0.1, accepts: [init, number, raster], empty_is_value: true }
              - { key: sy_conf, wbm: Aquifers.Aqf_SyCnfd, label: "Confined storage coefficient", type: dataset, default: 0.01, accepts: [init, number, raster], empty_is_value: true,
                  doc: "Storage coefficient of the confined aquifer." }
              - { key: ph, wbm: Aquifers.Aqf_Ph, label: "Near-surface horizontal permeability", type: dataset, default: -13.1, unit: "log10(m2)", accepts: [init, number, raster], empty_is_value: true,
                  doc: "Near-surface horizontal permeability, log10 m2; negative." }
              - { key: kh, wbm: Aquifers.Aqf_Kh, label: "Horizontal hydraulic conductivity", type: dataset, default: 10.6, unit: m/day, accepts: [init, number, raster], empty_is_value: true }
              - { key: kv, wbm: Aquifers.Aqf_Kv, label: "Vertical hydraulic conductivity", type: dataset, default: 1.6, unit: m/day, accepts: [init, number, raster], empty_is_value: true }
              - { key: kh_conf, wbm: Aquifers.Aqf_KhConf, label: "Confining-layer horizontal conductivity", type: dataset, default: 0.008, unit: m/day, accepts: [init, number, raster], empty_is_value: true }
              - { key: kv_conf, wbm: Aquifers.Aqf_KvConf, label: "Confining-layer vertical conductivity", type: dataset, default: 0.0008, unit: m/day, accepts: [init, number, raster], empty_is_value: true }
              - { key: e_folding, wbm: Aquifers.eFolding, label: "E-folding depth", type: dataset, default: 120, unit: m, accepts: [init, number, raster], empty_is_value: true,
                  doc: "Depth scale of the exponential decrease of horizontal conductivity with depth." }
              - { key: bed_resistance, wbm: Aquifers.BRes, label: "Riverbed resistance", type: dataset, default: 10, unit: day, accepts: [init, number, raster], empty_is_value: true,
                  doc: "Riverbed resistance, in days." }
              - { key: sle, wbm: Aquifers.SLE, label: "Sea level elevation", type: string, editable: true, default: 0,
                  doc: "Sea level elevation in m, used at exorheic basin outlets as the constant water table elevation outside the network. 0, or a string starting with 'min' for min(Net_DEM)." }
              - { key: boundary_flux, wbm: Aquifers.Aqf_BndFlx, label: "Allow flux outside network", type: bool01, editable: true, default: 0,
                  doc: "Allow groundwater flux to aquifers outside the network." }
              - { key: clump, wbm: Aquifers.Aqf_Clump, label: "Clump aquifers into one", type: bool01, editable: true, default: 0,
                  doc: "Treats all separate aquifers as one body, which speeds up runs but gives the aquifer statistics and water component tracking for one aquifer instead of one per separate aquifer. Read only for ModFlow." }
              - { key: well_max, wbm: Aquifers.wellMax, label: "Maximum well depth", type: number, editable: true, default: 1000000, unit: m,
                  doc: "Well depth; 1e6 m means no limit. Read only for ModFlow." }
              - { key: mf_steps, wbm: Aquifers.MF_steps, label: "Solver steps per time step", type: int, editable: true, default: 1,
                  doc: "Raise it when the log reports a stability criterion above 0.5. More steps make the solver more stable and the run slower." }
      - { module: springs, wbm: Springs, name: Springs, type: file, tier: advanced, editable: switch_off, versions: ["23.9.0"], accepts: [file], requires: [modules.groundwater_3d@enabled], on_if: key_present,
          doc: "CSV with the headers ID, Lon, Lat, Discharge and Elevation. WBM 23.9.0 only: 22.1.1 ignores it." }
      - { module: snow_elevation_lapse, wbm: snowBands, name: "Sub-grid scale temperature lapse for snow by elevation gradient", type: flag, editable: switch_off, on_if: key_present,
          doc: "Elevation bands for the snowpack, for coarse network grids. Needs the band files made by elevation_bands.pl next to the Network file. Uses the lapse rate of the temperature downscaling." }
      - module: din_tracking
        wbm: DIN
        name: "Dissolved Inorganic Nitrogen Tracking"
        tier: advanced
        editable: switch_off
        form: block_or_file
        on_if: key_present
        needs_output: "^DIN"
        unlocks_outputs: [DIN_Conc_Cons, DIN_Conc_Dsch, DIN_Conc_Rnff, DIN_Denit, DIN_Land_Load, DIN_Load, DIN_WWTP_Input, DIN_WWTP_Load, DIN_WWTP_Removal]
        doc: "The block does nothing unless an output name starts with DIN, and with such an output the block is mandatory. The nine DIN outputs are accepted on both versions."
        children:
          - { key: lu_sub, wbm: DIN.luSub, label: "Developed land fraction", type: dataset, accepts: [init, number, raster], required: true,
              doc: "Land-use fraction, developed. Required." }
          - { key: lu_agr, wbm: DIN.luAgr, label: "Agricultural land fraction", type: dataset, accepts: [init, number, raster], required: true,
              doc: "Land-use fraction, agriculture. Required." }
          - group: loading
            label: "Loading parameters"
            children:
              - { key: scale, wbm: DIN.scale, label: "Sigmoid scale", type: number, editable: true, default: 12.2,
                  doc: "Spread of the logistic curve of DIN concentration in runoff against developed and agricultural land." }
              - { key: asym, wbm: DIN.asym, label: "Maximum DIN concentration", type: number, editable: true, default: 1.4, unit: "mg DIN/L",
                  doc: "Highest DIN concentration in runoff from developed land." }
              - { key: asym_ag, wbm: DIN.asym_ag, label: "Maximum concentration with irrigation", type: number, editable: true, default: 4.8, unit: "mg DIN/L", show_if: modules.irrigated_crops@enabled,
                  doc: "Used only when Irrigation is on." }
              - { key: xmid_b, wbm: DIN.xMid_b, label: "Sigmoid midpoint intercept", type: number, editable: true, default: 40.3,
                  doc: "The curve's midpoint is intercept + slope × log10(runoff)." }
              - { key: xmid_m, wbm: DIN.xMid_m, label: "Sigmoid midpoint slope", type: number, editable: true, default: 19.5,
                  doc: "The curve's midpoint is intercept + slope × log10(runoff)." }
              - { key: bfi, wbm: DIN.BFI, type: number, tier: locked, default: 0.6, inert: true,
                  doc: "Stored but never used." }
          - group: removal
            label: "Removal parameters"
            children:
              - { key: slope, wbm: DIN.slope, label: "Removal slope", type: number, editable: true, default: -0.493,
                  doc: "Efficiency-loss slope of uptake velocity against concentration (Mulholland et al. 2008)." }
              - { key: intercept, wbm: DIN.intercept, label: "Removal intercept", type: number, editable: true, default: -2.975,
                  doc: "Uptake velocity intercept, log cm/s (Mulholland et al. 2008). WBM reads the key 'intercept'." }
              - { key: tnq, wbm: DIN.TnQ, label: "Temperature factor", type: number, editable: true, default: 2,
                  doc: "Removal is multiplied by this factor for every 10 C of water temperature above the reference temperature, and divided by it for every 10 C below. WBM uses the air temperature instead unless the run has a water temperature output (a name ending _twt)." }
              - { key: tn_ref, wbm: DIN.TnRef, label: "Reference temperature", type: number, editable: true, default: 20, unit: C,
                  doc: "Water temperature at which removal is neither raised nor lowered by the temperature factor." }
              - { key: sz_res, wbm: DIN.SzRes, label: "Seitzinger reservoir removal", type: bool01, editable: true, default: 0,
                  doc: "Seitzinger denitrification in reservoirs." }
          - group: wwtp
            wbm: DIN.WWTP
            label: "Wastewater treatment plants"
            children:
              - { key: pop_density, wbm: DIN.WWTP.PopDensity, label: "Population density", type: dataset, unit: persons/km2, accepts: [init], required_if: "wwtp used",
                  doc: "Data .init only: a raster path aborts WBM." }
              - { key: file, wbm: DIN.WWTP.WWTP_File, label: "Plant file", type: file, accepts: [file], required_if: "wwtp used" }
              - { key: lon, wbm: DIN.WWTP.Lon, label: "Longitude column", type: column }
              - { key: lat, wbm: DIN.WWTP.Lat, label: "Latitude column", type: column }
              - { key: pop_served, wbm: DIN.WWTP.popYear, label: "Population served column", type: column }
              - { key: t_level, wbm: DIN.WWTP.t_level, label: "Treatment level column", type: column,
                  doc: "Treatment level column." }
              - { key: ref_year, wbm: DIN.WWTP.refYear, label: "Population reference year", type: int, editable: true,
                  doc: "A year, not a column name. The population served in the plant file is taken as that of this year: plant loads are scaled each day by the population density relative to this year, between 0.25 and 4 times." }
              - { key: per_capita_n, wbm: DIN.WWTP.perCapitaNLoad, label: "Per-capita nitrogen load", type: number, editable: true, default: 0.019, unit: kg/person/day }
              - { key: search_dist, wbm: DIN.WWTP.search_dist, label: "Search distance", type: number, editable: true, default: 5, unit: km }
      - module: source_water_by_land_area
        wbm: Runoff_mask
        name: "Source water tracking by land area"
        editable: switch_off
        form: block_or_file
        on_if: key_present
        unlocks_outputs: [dischMsk, runoffMsk, grndWtMsk]
        switch_off_removes_outputs: true
        doc: "The block is the trigger. When present, at least one of dischMsk, runoffMsk and grndWtMsk must be an output; and any of those outputs needs the block. Switching the module off removes the three outputs."
        children:
          - { key: mask_type, type: enum, default: polygon, options: [polygon, sub_pixel], ui_only: true,
              doc: "polygon: whole pixels with IDs; sub_pixel: layers of fractions that sum to 1." }
          - group: polygon
            label: "Polygon masks"
            show_if: "mask_type == polygon"
            children:
              - { key: mask_file, wbm: Runoff_mask.maskFile, label: "Polygon ID raster", type: dataset, accepts: [raster], required: true,
                  doc: "Polygon IDs. GDAL raster only." }
              - { key: att_file, wbm: Runoff_mask.attFile, label: "Polygon attribute file", type: file, accepts: [file], required: true, empty_is_value: true,
                  doc: "CSV of polygon attributes. Selects the polygon branch." }
              - { key: basin_id_file, wbm: Runoff_mask.basinIDFile, label: "Basin ID raster", type: dataset, accepts: [raster], empty_is_value: true,
                  doc: "Optional; reduces the output to these basins. GDAL raster only." }
          - group: sub_pixel
            label: "Sub-pixel masks"
            show_if: "mask_type == sub_pixel"
            children:
              - { key: mask_list, wbm: Runoff_mask.maskList, label: "Mask list file", type: file, accepts: [file], required: true, empty_is_value: true,
                  doc: "CSV listing at least two fraction layers. Selects the sub-pixel branch." }
              - { key: col_file, wbm: Runoff_mask.ColFile, label: "File path column", type: column, required: true,
                  doc: "Column with the file paths." }
          - { key: col_id, wbm: Runoff_mask.colID, label: "ID column", type: column, required: true,
              doc: "ID column in the CSV." }
          - { key: col_name, wbm: Runoff_mask.colName, label: "Name column", type: column, required: true,
              doc: "Name column in the CSV." }
          - { key: model, wbm: Runoff_mask.model, label: "Mask tracking model", type: enum, editable: true, default: 0, options: {0: simple, 1: full},
              doc: "Simple: the runoff of a pixel counts as coming from that pixel's own mask. Full: the mask fractions are also carried through runoff storage and shallow groundwater. Any true value means the full model." }
          - { key: post_processing, wbm: Runoff_mask.PostProcessing, label: "Include in post-processing", type: bool01, editable: true, default: 0,
              doc: "Include the mask outputs in post-processing." }
      - { module: impervious_surface_runoff, wbm: Impervious, name: "Impervious Surface Runoff", type: dataset, tier: advanced, editable: switch_off, unit: fraction, fit: unit, accepts: [init, number, raster], on_if: key_present,
          doc: "Static or time series. A static value is a number, raster or data .init; a time series only a data .init. 0 counts as off." }
      - { module: canopy_interception, wbm: MT_LAI, name: "Canopy Interception of Precipitation", type: dataset, tier: advanced, editable: switch_off, unit: m2/m2, accepts: [init], required_if: "climate.pet_method == Penman-Monteith or any output name ends with _twt", on_if: key_present, rule: "must be a time series",
          doc: "Leaf area index, a time series. Turns on leaf water interception. Also required by Penman-Monteith PET and by the water-temperature model." }
      - module: water_demand
        wbm: WaterDemand
        name: "Industrial, Domestic, and Livestock Water Demand and Use"
        tier: advanced
        editable: switch_off
        form: block_or_file
        on_if: key_present
        children:
          - { key: population, wbm: WaterDemand.PopDensity, label: "Population density", type: dataset, unit: people/km2, accepts: [init], required: true,
              doc: "Static or annual time series." }
          - group: domestic
            label: "Domestic demand"
            children:
              - { key: per_capita, wbm: WaterDemand.DomDemandPP, label: "Domestic demand per capita", type: dataset, accepts: [init, number, raster], required: true,
                  doc: "Domestic demand per capita. Required." }
              - { key: return_fr, wbm: WaterDemand.DomDemandReturnFr, label: "Domestic return fraction", type: number, editable: true, default: 0.84, range: [0, 1] }
              - { key: search_km, wbm: WaterDemand.DomSearchDist, label: "Domestic search distance", type: number, editable: true, default_from: Irrigation.IrrSearchDist, unit: km, empty_is_value: true,
                  doc: "Omitted when empty: an empty value would mean a 0 km search distance." }
          - group: industrial
            label: "Industrial demand"
            children:
              - { key: per_capita, wbm: WaterDemand.IndDemandPP, label: "Industrial demand per capita", type: dataset, accepts: [init, number, raster], required: true,
                  doc: "Industrial demand per capita. Required." }
              - { key: return_fr, wbm: WaterDemand.IndDemandReturnFr, label: "Industrial return fraction", type: number, editable: true, default: 0.89, range: [0, 1] }
              - { key: search_km, wbm: WaterDemand.IndSearchDist, label: "Industrial search distance", type: number, editable: true, default_from: Irrigation.IrrSearchDist, unit: km, empty_is_value: true,
                  doc: "Omitted when empty." }
          - group: livestock
            label: "Livestock demand"
            children:
              - { key: params, wbm: WaterDemand.LivestockParam, label: "Livestock parameter file", type: file, accepts: [file], required: true,
                  doc: "CSV; required and must exist. Needs a column named Stock." }
              - { key: return_fr, wbm: WaterDemand.StkDemandReturnFr, label: "Livestock return fraction", type: number, editable: true, default: 0.95, range: [0, 1],
                  doc: "Return fraction in livestock water use." }
              - { key: search_km, wbm: WaterDemand.StkSearchDist, label: "Livestock search distance", type: number, editable: true, default_from: Irrigation.IrrSearchDist, unit: km, empty_is_value: true,
                  doc: "Omitted when empty." }
              - { key: ref_year, wbm: WaterDemand.StkRefYear, label: "Livestock reference year", type: int, editable: true, default: 2005, empty_is_value: true,
                  doc: "Omitted when empty." }
      - { module: land_cover_et, wbm: LandCover, name: "Land Cover-based ET", type: file, tier: advanced, editable: switch_off, accepts: [file], on_if: key_present,
          doc: "CSV file with a column named Description. Turns on land covers for the processes that use them. Only the spelling LandCover is read." }
      - module: irrigated_crops
        wbm: Irrigation
        name: "Irrigated Crops"
        editable: switch_off
        form: block_or_file
        on_if: key_present
        unlocks_outputs: [irrigationGross, irrigationFlow, irrigationGrwt, irrigationExtra, etIrrCrops, irrRunoff]
        doc: "Irrigated crops. Needs a crop area, a crop parameter file and an irrigation efficiency."
        children:
          - group: crop_data
            label: "Crop data"
            children:
              - { key: crop_area_frac, wbm: Irrigation.CropAreaFrac, label: "Crop area fraction", type: dataset, unit: fraction, accepts: [init, number, raster], required: true }
              - { key: crop_area_frac_patch, wbm: Irrigation.CropAreaFracPatch, label: "Crop area fraction patch", type: dataset, tier: advanced, accepts: [init, number, raster],
                  doc: "Fills nodata cells of CropAreaFrac." }
              - { key: crop_par_file, wbm: Irrigation.CropParFile, label: "Crop parameter file", type: file, accepts: [file], required: true,
                  doc: "Crop parameters CSV for 26 crop categories. LandFracTS, Kc_TS and RootDepth cells are data .init paths; CropDepletionFactor is a number or a data .init." }
              - { key: crop_par_file_patch, wbm: Irrigation.CropParFilePatch, label: "Crop parameter file patch", type: file, tier: advanced, accepts: [file] }
              - { key: extend_crop_ts, wbm: Irrigation.extendCropTS, label: "Extend crop time series", type: bool01, editable: true, default: 0,
                  doc: "Extend the crop time series using the first and last years (for future scenarios)." }
          - group: water_sources
            label: "Water sources"
            children:
              - { key: sw_gw_ratio, wbm: Irrigation.SW_GW_ratio, label: "Surface-to-groundwater ratio", type: dataset, accepts: [init, number, raster],
                  doc: "Share of irrigation demand meant for surface water: shallow groundwater supplies the rest first, then the river. If absent, Order is used. Cannot be a time series." }
              - { key: order, wbm: Irrigation.Order, label: "Source priority", type: enum, editable: true, default: 1, options: {0: "Groundwater first", 1: "Surface water first"}, show_if: "not sw_gw_ratio",
                  doc: "Which source irrigation takes from first: 0 groundwater, 1 stream. WBM uses it as a number, so it applies only when SW_GW_ratio is absent." }
              - { key: search_dist, wbm: Irrigation.IrrSearchDist, label: "Stream search distance", type: number, editable: true, default: 100, unit: km, aliases: [Irrigation.SearchDist],
                  doc: "Search distance for stream water. The old key SearchDist is an alias that wins when the init has it." }
              - { key: extra_coeff, wbm: Irrigation.ExtraCoeff, label: "Withdrawal factor outside aquifers", type: dataset, default: 1.0, range: [0, 1], accepts: [init, number, raster],
                  doc: "Unsustainable groundwater withdrawal factor outside aquifers. Cannot be a time series." }
              - { key: aqf_coeff, wbm: Irrigation.ExtraAqfCoeff, label: "Withdrawal factor over aquifers", type: dataset, tier: advanced, versions: ["23.9.0"], default: 1.0, range: [0, 1], accepts: [init, number, raster], aliases: [Irrigation.AqfCoeff],
                  doc: "Unsustainable withdrawal factor over aquifers. WBM 23.9.0 only: 22.1.1 ignores this key. The old key AqfCoeff is an alias that wins when the init has it." }
              - { key: aqf_coeff_v1, wbm: Irrigation.AqfCoeff, label: "Withdrawal factor over aquifers", type: dataset, tier: advanced, versions: ["22.1.1"], default: 1.0, range: [0, 1], accepts: [init, number, raster],
                  doc: "The WBM 22.1.1 name of the aquifer withdrawal factor. Aquifers do not exist on 22.1.1, so it has no effect there." }
              - { key: use_vis, wbm: Irrigation.useVIS, label: "Virtual irrigation storage", type: bool01, editable: true, default: 1,
                  doc: "Virtual irrigation storage (daily irrigation withdrawal)." }
          - group: application
            label: "Irrigation application"
            children:
              - { key: efficiency, wbm: Irrigation.IrrEfficiency, label: "Irrigation efficiency", type: dataset, unit: "%", accepts: [init, raster], required_if: "tech_application_file is empty",
                  doc: "Irrigation efficiency in percent. Needs a data .init or raster: a constant aborts WBM, and so does leaving it out, unless IrrTechApplicationFile supplies the efficiency." }
              - { key: return_coeff, wbm: Irrigation.ReturnCoeff, label: "Return flow to groundwater", type: number, editable: true, default: 1.0, range: [0, 1],
                  doc: "Share of irrigation application losses, after evaporation, that percolates to groundwater; the rest becomes surface runoff." }
              - { key: daily_irr, wbm: Irrigation.dailyIrr, label: "Irrigation demand mode", type: enum, editable: true, default: 0, options: {0: "By crop depletion factor", 1: Daily},
                  doc: "Not compatible with process-based irrigation efficiency." }
              - { key: app_rate_max, wbm: Irrigation.irrAppRate, label: "Maximum application rate", type: number, tier: advanced, editable: true, default: 50, unit: mm/day }
              - { key: tech_delivery_file, wbm: Irrigation.IrrTechDeliveryFile, label: "Delivery technology file", type: file, tier: advanced, accepts: [file],
                  doc: "Delivery parameters for efficiency- or process-based modeling." }
              - { key: tech_application_file, wbm: Irrigation.IrrTechApplicationFile, label: "Application technology file", type: file, tier: advanced, accepts: [file] }
          - group: rice
            label: "Rice paddies"
            children:
              - { key: paddy_depth, wbm: Irrigation.ricePaddyDepth, label: "Paddy depth", type: number, editable: true, default: 50, unit: mm }
              - { key: percolation, wbm: Irrigation.ricePercolation, label: "Paddy percolation rate", type: dataset, default: 5, unit: mm/day, accepts: [init, number, raster] }
          - group: area_growth
            label: "Area growth"
            tier: advanced
            children:
              - { key: irr_area_growth, wbm: Irrigation.irrAreaGrwth, label: "Irrigated area growth rate", type: number, editable: true, default: 0, unit: "1/yr",
                  doc: "Recommended 0.01179274." }
              - { key: irr_growth_ref_year, wbm: Irrigation.irrGrwthRefYr, label: "Irrigated area reference year", type: int, editable: true,
                  doc: "Reference year, if the data is not a time series." }
              - { key: crop_area_growth, wbm: Irrigation.crpAreaGrwth, label: "Crop area growth rate", type: number, editable: true, default: 0, unit: "1/yr",
                  doc: "Recommended 0.0023744." }
              - { key: crop_growth_ref_year, wbm: Irrigation.crpGrwthRefYr, label: "Crop area reference year", type: int, editable: true }
      - { module: water_age, name: "Water age", on_if: {output_match: "^streamAge$"}, derived: true, suggested_outputs: [streamAge],
          doc: "Switched on by a streamAge output." }
      - { module: runoff_source_tracking, name: "Runoff source tracking", on_if: {output_suffix: [_gm, _sm, _rr, _bf]}, derived: true, suggested_outputs: [runoff_gm, runoff_sm, runoff_rr, runoff_bf, discharge_gm, discharge_sm, discharge_rr, discharge_bf],
          doc: "Tracks runoff by source: _rr rain and surface runoff, _bf baseflow, _sm snow melt, _gm glacier melt. Switched on by any such output." }
      - { module: primary_source_tracking, name: "Primary water source tracking", on_if: {output_suffix: [_ps, _pg, _pr, _pu]}, derived: true, suggested_outputs: [runoff_ps, runoff_pu, runoff_pr, runoff_pg, discharge_ps, discharge_pu, discharge_pr, discharge_pg, soilMoist_ps, soilMoist_pu, soilMoist_pr, soilMoist_pg, grndWater_ps, grndWater_pu, grndWater_pr, grndWater_pg], requires_for_output: {_pg: modules.glaciated_area_runoff@enabled},
          doc: "Tracks water by primary source: _ps snow, _pg glacier, _pr rain, _pu unsustainable groundwater. Glacier melt can only be tracked when glacier water is provided." }
      - { module: irrigation_reuse_tracking, name: "Irrigation water re-use tracking", on_if: {output_suffix: [_irr, _pst, _use, _rlt]}, derived: true, suggested_outputs: [runoff_pst, runoff_irr, runoff_rlt, runoff_use, discharge_pst, discharge_irr, discharge_rlt, discharge_use, grndWater_pst, grndWater_irr, grndWater_rlt, grndWater_use], warn_unless: [modules.irrigated_crops@enabled],
          doc: "Tracks irrigation water re-use and related sources: _pst pristine, _rlt relict, _use domestic, industrial and livestock return, _irr irrigation. Cancelled when Irrigation is off: the variables are then dropped without an error." }
      - { module: water_temperature, name: "Water temperature", requires: [climate.airT_yearly_clim, climate.extra_drivers.wind_u, climate.extra_drivers.wind_v, climate.extra_drivers.humidity, climate.extra_drivers.cloud_fraction, land.canopy_height, modules.canopy_interception@enabled], on_if: {output_suffix: [_twt]}, derived: true, suggested_outputs: [discharge_twt],
          doc: "Accepted names are discharge_twt and baseflow_twt only. Needs airT_yc, the cloud, wind and humidity drivers, canopyHt and MT_LAI." }
      - { module: green_blue_water, name: "Green and blue water", on_if: {output_match: "Moist(Gr|Bl)|[BG]W_(ET|SM)"}, derived: true, suggested_outputs: [],
          doc: "Triggered by any output matching Moist(Gr|Bl) or [BG]W_(ET|SM), including the per-crop _BW_ET and _GW_ET names." }
      - { module: endorheic_components, name: "Endorheic lake components", versions: ["23.9.0"], on_if: {output_match: "^endoStrg_(mm_|km3_)*(pg|ps|pr|pu)"}, derived: true, suggested_outputs: [],
          doc: "WBM 23.9.0 accepts four names: endoStrg_mm_pg, _ps, _pr and _pu. WBM 22.1.1 has the trigger but accepts no name." }

  - group: other_blocks
    label: "Other blocks"
    tier: advanced
    children:
      - module: water_rights
        wbm: WaterRights
        tier: locked
        inert: true
        form: block_or_file
        doc: "Ignored by WBM. Kept so that an init that carries it still round-trips."
        children:
          - { key: wr_ids, wbm: WaterRights.WR_IDs, inert: true }
          - { key: wr_dir, wbm: WaterRights.WR_Dir, inert: true }
          - { key: donor_res_mapping, wbm: WaterRights.donorResMapping, inert: true }
          - { key: dom_ex_thd, wbm: WaterRights.domExThd, type: number, default: 0, inert: true }
          - { key: cattle_ex_fr, wbm: WaterRights.cattleExFr, type: number, default: 0, inert: true }
      - { module: usgs, wbm: USGS, name: "USGS gauge metadata", type: file, tier: advanced, versions: ["23.9.0"], accepts: [file],
          doc: "USGS gauge metadata CSV. WBM 23.9.0 only: 22.1.1 ignores the key." }

  - group: outputs
    label: Outputs
    children:
      - { key: variables, wbm: Output_vars, type: list, tier: basic, draft_field: variables, default: [runoff, discharge], required: true, options_from: {"23.9.0": output_vars/23.9.0.txt, "22.1.1": output_vars/22.1.1.txt}, rejects: [empty, whitespace_only], processes_triggered_by_names: [water_age, runoff_source_tracking, primary_source_tracking, irrigation_reuse_tracking, water_temperature, din_tracking, green_blue_water, endorheic_components],
          doc: "The output variables, as a whitespace-separated list. Never empty." }
      - group: post_processing
        wbm: PostProcessing
        label: Post-processing
        draft_field: post_processing
        form: block_or_file
        switch: true
        on_if: key_present
        doc: "Builds a temporal and spatial post-processing script. Off is written as '', never as { Run => 0 }. Needs at least one variable to process."
        children:
          - { key: run, wbm: PostProcessing.Run, type: bool01, tier: basic, default: 0,
              doc: "Start the aggregation script from WBM. The block is validated even when 0." }
          - { key: var_list, wbm: PostProcessing.Var_list, type: list, tier: advanced, source: outputs.variables,
              doc: "Variables to process (whitespace list); empty means all." }
          - { key: temporal_aggregation, wbm: PostProcessing.Temporal_Aggregation, type: bool01, tier: basic, default: 0 }
          - { key: runtime_aggregation, wbm: PostProcessing.Runtime_Aggregation, type: bool01, tier: advanced, default: 1,
              doc: "Aggregate during the run (no climatology)." }
          - { key: ta_depth, wbm: PostProcessing.TA_depth, type: enum, tier: advanced, default: year, options: [day, month, year] }
          - { key: climatology, wbm: PostProcessing.Climatology, type: bool01, tier: advanced, default: 1 }
          - { key: ta_multi_year_start, wbm: PostProcessing.TA_multi_year_start, type: int, tier: advanced, show_if: "climatology == 1", rule: "within the run years whenever the block is present, even with Run 0; start and timestep are both set or both empty" }
          - { key: ta_multi_year_timestep, wbm: PostProcessing.TA_multi_year_timestep, type: int, tier: advanced, show_if: "climatology == 1" }
          - { key: trim, wbm: PostProcessing.Trim, type: bool01, tier: advanced, default: 0,
              doc: "Absent means 0." }
          - group: polygon_aggregation
            wbm: PostProcessing.Polygon_Aggregation
            tier: advanced
            doc: "0 or empty means off; otherwise a block. IDs must be data .init paths."
            children:
              - { key: ids, wbm: PostProcessing.Polygon_Aggregation.IDs, type: list, required_if: "polygon aggregation is on", source: "polygon masks (data .init with Processing => polygon) in the model input" }
              - { key: mt, wbm: PostProcessing.Polygon_Aggregation.MT, type: string, tier: locked, inert: true,
                  doc: "Ignored by WBM." }
              - { key: rasterization_res, wbm: PostProcessing.Polygon_Aggregation.Rasterization_Res, type: number,
                  doc: "Required for vector polygon masks." }
          - { key: forks, wbm: PostProcessing.Forks, type: int, tier: locked, default: 8, min: 1, value: "{slurm_cpus}" }

# Rules checked across the whole tree. `level` is shown in the issue list; `versions` narrows a rule.
cross_rules:
  - { id: run_start_or_spinup_start, level: error, rule: "run.period.start OR spinup.start is set, as YYYY-MM-DD (YYYY-MM-00 for monthly)" }
  - { id: run_end_airT, level: error, rule: "run.period.end is empty -> climate.air_temp.primary is set (the airTmin/airTmax form is not enough)" }
  - { id: run_start_before_end, level: error, rule: "run.period.start < run.period.end (end may be empty -> end of MT_airT.Primary)" }
  - { id: spinup_loops_dates, level: error, rule: "spinup.loops > 0 -> spinup.start and spinup.end are set and start < end" }
  - { id: calendar_not_360, level: error, rule: "run.period.calendar is not 360 (WBM accepts it and then aborts)" }
  - { id: file_size_day_monthly, level: error, rule: "run.period.file_size == day is invalid with a monthly time series; hourly forces day" }
  - { id: output_dir_absolute, level: warn, rule: "output_dir is absolute; mt_id has no leading '/'" }
  - { id: network_routing, level: error, rule: "network is set and is a raster; routing is written (Routing is required)" }
  - { id: dataset_file_coverage, level: error, rule: "for every dataset the gateway can reach (climate drivers, soil, land, glaciers, crops, demand, ... and every data .init they point to): Start_Date/End_Date cover spin-up start..run end (or it is a *_clim / yearly_clim dataset) AND every file the File_Path template expands to exists in the model input for every day (daily), month (monthly) or year (yearly) of spin-up + run" }
  - { id: precip_fraction_pairing, level: error, rule: "precip.primary is monthly -> precip_fraction is set; precip.primary is daily -> precip_fraction is omitted" }
  - { id: precip_units, level: error, rule: "precipitation Units start mm/d or mm/h (daily/hourly) or mm/m (monthly); precip_fraction Units start 'frac'" }
  - { id: pet_drivers, level: error, rule: "pet_method in [Penman-Monteith, FAO-56] -> wind_u, wind_v, humidity, cloud_fraction, albedo are set" }
  - { id: pet_pm_canopy, level: error, rule: "pet_method == Penman-Monteith -> canopy_height and canopy_interception (MT_LAI) are set" }
  - { id: twt_inputs, level: error, rule: "any output name ends with _twt -> airT_yearly_clim, wind_u, wind_v, humidity, cloud_fraction, canopy_height and canopy_interception (MT_LAI) are set" }
  - { id: humidity_units, level: error, rule: "humidity Units are per/%, kg or degC; kg/kg -> elevation is a non-zero number or a layer" }
  - { id: soil_awc_precedence, level: warn, rule: "soil_awc set -> field_capacity and wilting_point are not read and are not written" }
  - { id: soil_fc_wp, level: error, rule: "soil_water.input_form == fc_wp -> field_capacity and wilting_point are set and are not both numbers" }
  - { id: lapse_downscale_requires, level: error, rule: "lapse_downscale on -> air_temp.input_form == mean, and no secondary air temperature unless force_sec_temp" }
  - { id: bias_correction_pairs, level: error, rule: "bias-correction pairs are complete (mod and obs both set, or neither)" }
  - { id: timeseries_in_layer_field, level: warn, rule: "a time-series data .init sits in a field read as a layer (sampled at 2001-01-01)" }
  - { id: module_on_has_value, level: error, rule: "a module that is on has a value: its wbm key, or every `required` child" }
  - { id: springs_need_aquifers, level: error, rule: "springs on -> groundwater_3d on", versions: ["23.9.0"] }
  - { id: modflow_required, level: error, rule: "groundwater_3d type == ModFlow -> dem, net_dem, thickness are set; head_top and head_depth_top are not both set (nor the bottom pair)" }
  - { id: snow_bands_files, level: error, rule: "snow_elevation_lapse on -> band files exist next to the Network file" }
  - { id: irrigation_efficiency, level: error, rule: "irrigated_crops on -> efficiency is an init or raster, unless tech_application_file is set" }
  - { id: water_demand_required, level: error, rule: "water_demand on -> population, both per_capita values and livestock params are set" }
  - { id: open_water_mask, level: error, rule: "open_water_flush_routing on -> mask is set" }
  - { id: file_modules_need_file, level: error, rule: "inter_basin_transfers or reservoirs on -> file exists and skip_lines is written" }
  - { id: muskingum_fallback_22, level: warn, rule: "routing.method == Muskingum and any of inter_basin_transfers, water_demand, irrigated_crops, open_water_evaporation is on -> WBM replaces Muskingum by LRR", versions: ["22.1.1"] }
  - { id: muskingum_note, level: info, rule: "routing.method == Muskingum: the manual limits it to coarse grids (Courant number << 1) and says it exits when abstractions exist; WBM 23.9.0 ran it with openWaterEvap" }
  - { id: msk_outputs_runoff_mask_pairing, level: error, rule: "at least one of dischMsk, runoffMsk, grndWtMsk is in outputs.variables <=> source_water_by_land_area (the Runoff_mask block) is on" }
  - { id: din_outputs_din_block, level: error, rule: "any output name starts with DIN -> din_tracking is on (the DIN block is set, with lu_sub and lu_agr)" }
  - { id: din_block_without_output, level: warn, rule: "din_tracking is on and no output name starts with DIN: WBM ignores the block" }
  - { id: irr_outputs_without_irrigation, level: warn, rule: "an output name ends with _irr|_pst|_use|_rlt and irrigated_crops is off: WBM drops the variables silently" }
  - { id: pg_without_glaciers, level: warn, rule: "an output name ends with _pg and glaciated_area_runoff is off (the manual says glacier melt can only be tracked when glacier water is provided; WBM's behaviour is not established)" }
  - { id: comp_balance_tracking, level: warn, rule: "comp_balance = 1 -> primary_source_tracking or irrigation_reuse_tracking is on (WBM forces it to 0 otherwise)" }
  - { id: output_vars_self_added, level: error, rule: "outputs.variables does not list names WBM adds itself (<var>_irr_<k>, dischMsk_<id>)" }
  - { id: ta_multi_year_start_in_run, level: error, rule: "post_processing is on (the block is present, even with run = 0) and ta_multi_year_start is set -> it lies within the run years, and ta_multi_year_timestep is set too" }
  - { id: post_processing_required_inputs, level: error, rule: "post_processing is on -> at least one variable to process; polygon aggregation -> ids; vector masks -> rasterization_res" }
