<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 660" width="830" height="660"
     role="img" aria-labelledby="dep-title" aria-describedby="dep-desc">
  <title id="dep-title">What runs where — deployment topology</title>
  <desc id="dep-desc">
    Three tiers, all within Anvil except the git host. At the top, Purdue GitHub Enterprise holds one repository with the
    application, the toolkit, the schemas and CI, and publishes downward into two places: the openghm namespace on
    Anvil's Composable Subsystem, and the Anvil S3 bucket. The Composable Subsystem box lists two
    new workloads — zot, an OCI registry for SIFs that stores its blobs directly in Anvil S3, and
    a static JSON Schema host — plus one already running: ingress-nginx with cert-manager for TLS.
    At the bottom, Anvil's HPC side consumes: a login node pulls from zot over the public internet
    and stages onto GPFS, and SLURM compute nodes run the container and read raw data from Anvil
    S3 over the internal network.
  </desc>

  <style>
    .g-b   { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .g-m   { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .g-ink { fill: #131C1B; }
    .g-mut { fill: #5C6B69; }
    .g-fnt { fill: #8A9997; }
    .g-acc { fill: #10695C; }
    .g-wrn { fill: #A8532A; }
    .g-bd  { font-weight: 700; }
    .g-cap { letter-spacing: 0.07em; }
  </style>

  <defs>
    <marker id="d-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#131C1B"/>
    </marker>
  </defs>

  <!-- ── tier 1 · publish ────────────────────────────────────────────────── -->
  <rect x="250" y="16" width="500" height="76" rx="4" fill="none" stroke="#131C1B" stroke-width="1.8"/>
  <text class="g-b g-bd g-ink" x="500" y="45" text-anchor="middle" font-size="15">GitHub Enterprise — the source of truth</text>
  <text class="g-m g-mut"      x="500" y="68" text-anchor="middle" font-size="11.5">one repo &#183; app &#183; toolkit &#183; schemas &#183; Actions (CI)</text>

  <!-- ── tier 2 · serve ──────────────────────────────────────────────────── -->
  <rect x="20" y="150" width="450" height="216" rx="4" fill="none" stroke="#8A9997" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="g-m g-fnt g-cap" x="28" y="140" font-size="11.5">ANVIL COMPOSABLE SUBSYSTEM</text>

  <rect x="38" y="178" width="414" height="50" rx="3" fill="none" stroke="#10695C" stroke-width="1.6"/>
  <text class="g-m g-bd g-acc" x="52"  y="200" font-size="13">zot</text>
  <text class="g-m g-bd g-acc g-cap" x="438" y="199" text-anchor="end" font-size="10">NEW</text>
  <text class="g-b g-acc"      x="52"  y="218" font-size="10.5">OCI registry for SIFs &#183; registry.openghm.org</text>

  <rect x="38" y="240" width="414" height="50" rx="3" fill="none" stroke="#10695C" stroke-width="1.6"/>
  <text class="g-m g-bd g-acc" x="52"  y="262" font-size="13">schemas</text>
  <text class="g-m g-bd g-acc g-cap" x="438" y="261" text-anchor="end" font-size="10">NEW</text>
  <text class="g-b g-acc"      x="52"  y="280" font-size="10.5">schema host &#183; proxies S3 &#183; schemas.openghm.org</text>

  <rect x="38" y="302" width="414" height="46" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2"/>
  <text class="g-m g-bd g-ink" x="52" y="323" font-size="12.5">ingress-nginx + cert-manager</text>
  <text class="g-b g-mut"      x="52" y="340" font-size="10.5">already running &#8212; TLS for both hostnames</text>

  <rect x="500" y="150" width="222" height="86" rx="4" fill="none" stroke="#131C1B" stroke-width="1.5"/>
  <text class="g-b g-bd g-ink" x="611" y="177" text-anchor="middle" font-size="13">Anvil S3</text>
  <text class="g-m g-mut"      x="611" y="197" text-anchor="middle" font-size="10.5">openghm bucket &#183; public read</text>
  <text class="g-b g-mut"      x="611" y="216" text-anchor="middle" font-size="10.5">images, snapshots, code + zot storage</text>

  <!-- ── tier 3 · consume ────────────────────────────────────────────────── -->
  <rect x="250" y="520" width="500" height="120" rx="4" fill="none" stroke="#131C1B" stroke-width="1.5"/>
  <text class="g-m g-ink g-cap" x="258" y="510" font-size="11.5">ANVIL HPC &#8212; WHERE RUNS HAPPEN</text>

  <rect x="266" y="548" width="210" height="64" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2"/>
  <text class="g-m g-bd g-ink" x="371" y="573" text-anchor="middle" font-size="12">login node</text>
  <text class="g-b g-mut"      x="371" y="592" text-anchor="middle" font-size="10.5">pull + stage &#183; outbound HTTPS</text>

  <rect x="520" y="548" width="214" height="64" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2"/>
  <text class="g-m g-bd g-ink" x="627" y="573" text-anchor="middle" font-size="12">SLURM compute</text>
  <text class="g-b g-mut"      x="627" y="592" text-anchor="middle" font-size="10.5">runs the container &#183; via Anvil S3</text>

  <text class="g-b g-mut" x="266" y="631" font-size="10.5">Anvil S3 holds the published copy; GPFS is staging for runs.</text>

  <!-- ── publish edges ───────────────────────────────────────────────────── -->
  <g fill="none" stroke="#131C1B" stroke-width="1.8">
    <line x1="300" y1="92" x2="300" y2="146" marker-end="url(#d-ai)"/>
    <line x1="611" y1="92" x2="611" y2="146" marker-end="url(#d-ai)"/>
  </g>
  <text class="g-m g-ink" x="310" y="116" font-size="11.5">installs the chart,</text>
  <text class="g-m g-ink" x="310" y="131" font-size="11.5">pushes the image</text>
  <text class="g-m g-ink" x="620" y="116" font-size="11.5">copies the files</text>
  <text class="g-m g-ink" x="620" y="131" font-size="11.5">(MinIO client)</text>

  <!-- ── zot's storage backend (new — zot writes its blobs into Anvil S3) ─── -->
  <polyline points="452,203 480,203 480,150 500,150" fill="none" stroke="#10695C" stroke-width="1.8" marker-end="url(#d-ai)"/>
  <text class="g-m g-acc" x="456" y="145" font-size="11">stores blobs</text>
  <polyline points="452,265 510,265 510,240" fill="none" stroke="#10695C" stroke-width="1.8" marker-end="url(#d-ai)"/>
  <text class="g-m g-acc" x="516" y="258" font-size="11">reads from</text>

  <!-- ── consume edges ───────────────────────────────────────────────────── -->
  <g fill="none" stroke="#131C1B" stroke-width="1.8">
    <polyline points="38,212 14,212 14,472 371,472 371,544" marker-end="url(#d-ai)"/>
    <line x1="611" y1="236" x2="611" y2="544" marker-end="url(#d-ai)"/>
    <line x1="480" y1="580" x2="516" y2="580" marker-end="url(#d-ai)"/>
  </g>
  <text class="g-m g-ink" x="22" y="436" font-size="11.5">installs a revision</text>
  <text class="g-m g-ink" x="22" y="451" font-size="11.5">&#8212; once per image</text>
  <text class="g-m g-ink" x="622" y="382" font-size="11.5">reads per run</text>
  <text class="g-b g-mut" x="622" y="399" font-size="10.5">SIF mirror + snapshot/raw data</text>
  <text class="g-m g-mut" x="498" y="570" text-anchor="middle" font-size="10.5">stage</text>
</svg>
