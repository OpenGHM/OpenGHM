<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 0 820 800" width="820" height="800"
     role="img" aria-labelledby="dgm-title" aria-describedby="dgm-desc">
  <title id="dgm-title">Snapshot assembly and run graph</title>
  <desc id="dgm-desc">
    A spec repository sits at the top. Below it a read-only snapshot folder holds metadata.json
    above three sibling boxes: the published wbm_output, the bundled code and configuration, and
    a dashed spool cache. metadata.json makes two dashed pin edges — one up to the spec
    repository, one right to a group of external stores holding the image registry and the model
    input store. The bundled content flows down into a WBM run on a solid edge; the spool flows
    down on a dashed conditional edge; the external stores feed the run from the right. Input
    data is not bundled: it is a published model input the run pulls by id. The run writes down
    into a writable per-simulation scratch directory containing wbm_output, WBM_run_state and a
    spool. The snapshot's own wbm_output has no outgoing edge: it is carried, not consumed.
  </desc>

  <!-- SVG <style> is not scoped, so every class is g- prefixed: this markup is
       inlined into an HTML page and must not collide with the page's classes. -->
  <style>
    .g-b    { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .g-m    { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .g-ink  { fill: #131C1B; }
    .g-mut  { fill: #5C6B69; }
    .g-fnt  { fill: #8A9997; }
    .g-acc  { fill: #10695C; }
    .g-bd   { font-weight: 700; }
    .g-cap  { letter-spacing: 0.07em; }
  </style>

  <defs>
    <marker id="g-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#131C1B"/>
    </marker>
    <marker id="g-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#10695C"/>
    </marker>
    <marker id="g-af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8A9997"/>
    </marker>
  </defs>

  <!-- ── spec repository ─────────────────────────────────────────────────── -->
  <rect x="390" y="14" width="210" height="60" rx="4" fill="none" stroke="#10695C" stroke-width="1.5"/>
  <text class="g-b g-bd g-acc" x="495" y="40" text-anchor="middle" font-size="15">Spec repository</text>
  <text class="g-m g-acc"      x="495" y="61" text-anchor="middle" font-size="11.5">snapshot-spec &#183; semver</text>

  <!-- ── snapshot boundary (read-only) ───────────────────────────────────── -->
  <rect x="215" y="120" width="560" height="268" rx="4" fill="none" stroke="#8A9997" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="g-m g-fnt g-cap" x="223" y="110" font-size="12">SNAPSHOT &#8212; READ-ONLY</text>

  <rect x="370" y="140" width="250" height="54" rx="4" fill="none" stroke="#131C1B" stroke-width="1.8"/>
  <text class="g-m g-ink g-bd" x="495" y="166" text-anchor="middle" font-size="14.5">metadata.json</text>
  <text class="g-b g-mut"      x="495" y="184" text-anchor="middle" font-size="11.5">identity + pins</text>

  <!-- s1 · reference output -->
  <rect x="233" y="222" width="166" height="132" rx="4" fill="none" stroke="#131C1B" stroke-width="1.5"/>
  <text class="g-m g-ink g-bd" x="316" y="246" text-anchor="middle" font-size="12.5">wbm_output/</text>
  <text class="g-b g-ink"      x="316" y="266" text-anchor="middle" font-size="11.5">published results</text>
  <text class="g-b g-mut"      x="316" y="286" text-anchor="middle" font-size="11">&#8776;470 GB &#183; Global</text>
  <text class="g-b g-mut"      x="316" y="312" text-anchor="middle" font-size="11">excluded from SHA256SUMS</text>
  <text class="g-b g-mut"      x="316" y="330" text-anchor="middle" font-size="11">never mounted</text>

  <!-- s2 · bundled input content -->
  <rect x="412" y="222" width="166" height="132" rx="4" fill="none" stroke="#131C1B" stroke-width="1.5"/>
  <text class="g-b g-ink g-bd" x="495" y="244" text-anchor="middle" font-size="13">bundled content</text>
  <text class="g-m g-ink"      x="495" y="264" text-anchor="middle" font-size="11.5">model/  utilities/</text>
  <text class="g-m g-ink"      x="495" y="282" text-anchor="middle" font-size="11.5">wbm_init/</text>
  <text class="g-m g-ink"      x="495" y="300" text-anchor="middle" font-size="11.5">gdal_test_files/</text>
  <text class="g-b g-mut"      x="495" y="324" text-anchor="middle" font-size="11">495 MB &#183; Global</text>
  <text class="g-b g-mut"      x="495" y="342" text-anchor="middle" font-size="11">covered by SHA256SUMS</text>

  <!-- s3 · spool cache -->
  <rect x="591" y="222" width="166" height="132" rx="4" fill="none" stroke="#8A9997" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="g-m g-fnt g-bd" x="674" y="246" text-anchor="middle" font-size="12.5">spool/</text>
  <text class="g-b g-fnt"      x="674" y="266" text-anchor="middle" font-size="11.5">warped-grid cache</text>
  <text class="g-b g-fnt"      x="674" y="286" text-anchor="middle" font-size="11">490 GB &#183; Global</text>
  <text class="g-b g-fnt"      x="674" y="312" text-anchor="middle" font-size="11">excluded from SHA256SUMS</text>
  <text class="g-b g-fnt"      x="674" y="330" text-anchor="middle" font-size="11">regenerable</text>

  <!-- ── WBM run ─────────────────────────────────────────────────────────── -->
  <rect x="380" y="468" width="320" height="86" rx="4" fill="none" stroke="#131C1B" stroke-width="2.2"/>
  <text class="g-b g-ink g-bd" x="540" y="503" text-anchor="middle" font-size="16">WBM run</text>
  <text class="g-b g-mut"      x="540" y="525" text-anchor="middle" font-size="11.5">assembled at execution time</text>

  <!-- ── external stores (pinned, not bundled) ───────────────────────────── -->
  <rect x="800" y="430" width="200" height="175" rx="4" fill="none" stroke="#10695C" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="g-m g-acc g-cap" x="808" y="416" font-size="11.5">EXTERNAL &#8212; PINNED</text>

  <rect x="812" y="448" width="176" height="62" rx="3" fill="none" stroke="#10695C" stroke-width="1.5"/>
  <text class="g-b g-bd g-acc" x="900" y="472" text-anchor="middle" font-size="13">Image registry</text>
  <text class="g-m g-acc"      x="900" y="492" text-anchor="middle" font-size="10.5">zot + S3 &#183; by digest</text>

  <rect x="812" y="526" width="176" height="62" rx="3" fill="none" stroke="#10695C" stroke-width="1.5"/>
  <text class="g-b g-bd g-acc" x="900" y="550" text-anchor="middle" font-size="13">Model input</text>
  <text class="g-m g-acc"      x="900" y="570" text-anchor="middle" font-size="10.5">Anvil S3 &#183; by id</text>

  <!-- ── per-sim scratch (writable) ──────────────────────────────────────── -->
  <rect x="215" y="650" width="560" height="136" rx="4" fill="none" stroke="#131C1B" stroke-width="1.5"/>
  <text class="g-m g-ink g-cap" x="223" y="640" font-size="12">PER-SIM SCRATCH &#8212; WRITABLE</text>

  <rect x="233" y="674" width="166" height="62" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2"/>
  <text class="g-m g-ink g-bd" x="316" y="698" text-anchor="middle" font-size="12">wbm_output/</text>
  <text class="g-b g-mut"      x="316" y="718" text-anchor="middle" font-size="11">the run's results</text>

  <rect x="412" y="674" width="166" height="62" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2"/>
  <text class="g-m g-ink g-bd" x="495" y="698" text-anchor="middle" font-size="12">WBM_run_state/</text>
  <text class="g-b g-mut"      x="495" y="718" text-anchor="middle" font-size="11">resume state</text>

  <rect x="591" y="674" width="166" height="62" rx="3" fill="none" stroke="#5C6B69" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="g-m g-ink g-bd" x="674" y="698" text-anchor="middle" font-size="12">spool/</text>
  <text class="g-b g-mut"      x="674" y="718" text-anchor="middle" font-size="11">seeded or built cold</text>

  <text class="g-b g-mut" x="233" y="758" font-size="11.5">+ per-sim wbm_init/ copy &#183; simulation.json provenance &#183; slurm logs</text>
  <text class="g-b g-mut" x="233" y="774" font-size="11.5">Nothing here is ever written back into the snapshot.</text>

  <!-- ── pin edges (dashed accent — no bytes move) ───────────────────────── -->
  <g fill="none" stroke="#10695C" stroke-width="1.5" stroke-dasharray="7 5">
    <line x1="495" y1="140" x2="495" y2="80" marker-end="url(#g-aa)"/>
    <polyline points="620,167 872,167 872,424" marker-end="url(#g-aa)"/>
  </g>
  <text class="g-m g-acc" x="507" y="112" font-size="12.5">conforms to</text>
  <text class="g-m g-acc" x="882" y="296" font-size="12.5">pinned by</text>
  <text class="g-m g-acc" x="882" y="312" font-size="12.5">digest / id</text>

  <!-- ── external stores -> run ──────────────────────────────────────────── -->
  <line x1="798" y1="518" x2="704" y2="518" stroke="#10695C" stroke-width="1.8" marker-end="url(#g-aa)"/>
  <text class="g-m g-acc" x="751" y="492" text-anchor="middle" font-size="12">pulled at</text>
  <text class="g-m g-acc" x="751" y="507" text-anchor="middle" font-size="12">run time</text>

  <!-- ── bundled -> run ─────────────────────────────────────────────────── -->
  <line x1="495" y1="354" x2="495" y2="464" stroke="#131C1B" stroke-width="2.2" marker-end="url(#g-ai)"/>
  <text class="g-m g-ink" x="505" y="400" font-size="12.5">mounted</text>
  <text class="g-m g-ink" x="505" y="416" font-size="12.5">read-only</text>

  <!-- ── spool -> run (conditional; must be copied, snapshot is :ro) ─────── -->
  <line x1="674" y1="354" x2="674" y2="464" stroke="#8A9997" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g-af)"/>
  <text class="g-m g-fnt" x="686" y="400" font-size="12.5">copied out</text>
  <text class="g-m g-fnt" x="686" y="416" font-size="12.5">only if valid</text>

  <!-- ── run -> scratch (lands in the gap between children: it writes all) ─ -->
  <line x1="584" y1="554" x2="584" y2="646" stroke="#131C1B" stroke-width="2.6" marker-end="url(#g-ai)"/>
  <text class="g-m g-ink g-bd" x="596" y="605" font-size="12.5">writes</text>

</svg>
