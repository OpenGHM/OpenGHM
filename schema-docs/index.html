<!DOCTYPE html>
<html lang="en" data-theme="light">
<!--
  Forced to light: json-schema-for-humans' own generated pages
  (generated/**/metadata.html) are Bootstrap-based and light-only, so this
  index is pinned to light too rather than switching to dark under Pico's
  prefers-color-scheme default and looking inconsistent next to them.

  Hand-written, not generated — it transcribes schemas/*-spec/index.json
  directly and must be updated by hand in the same commit as that file
  changes (AGENTS.md rule 4). generated/ is the one part of this directory
  that regenerates on its own: run `just schema-docs-gen` after any
  metadata.json change and commit the result. See ADR 0021.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGHM schema docs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <h1>OpenGHM schema docs</h1>
  <ul>
    <li><a href="generated/snapshot-spec/1.0.0/metadata.html">snapshot-spec — 1.0.0</a></li>
    <li><a href="generated/model-input-spec/1.0.0/metadata.html">model-input-spec — 1.0.0</a></li>
  </ul>
</main>
</body>
</html>
