[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openghm"
version = "0.2.0"
description = "WBM toolkit for Anvil HPC — a library + CLI wrapping the WBM tools-lite Singularity container"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "openghm" }]
keywords = ["wbm", "hydrology", "hpc", "anvil", "singularity"]

# The dependencies are pure-Python (no native extensions), so `pip install`
# works cleanly on Anvil's `module load python/3.9.5` toolchain. The one
# exception is the optional `output` extra below (h5py and numpy are native
# wheels), which only `openghm output ...` needs.
dependencies = [
  "click>=8.1",
  "rich>=13",
  "questionary>=2",
  "tomli>=2 ; python_version < '3.11'",
  # `openghm snapshot validate` / `openghm model-input validate` (spec.py):
  # jsonschema>=4.18 for the `referencing`-based Registry, needed to resolve a
  # schema's relative $ref into schemas/common/ from the bundled tree offline.
  "jsonschema>=4.18",
  # jsonschema checks "format": "date-time" and "uri" only when these are
  # importable, and passes anything silently when they are not.
  "rfc3339-validator>=0.1.4",
  "rfc3986-validator>=0.1.1",
]

[project.optional-dependencies]
# `openghm output inventory` / `openghm output subset` (ADR 0033) read and write
# NetCDF-4. h5py and numpy are native wheels that install on Anvil's Python 3.9
# (h5py 3.14.0, numpy 2.0.2 checked 2026-10-09); h5netcdf writes the downloaded
# subset as a valid NetCDF-4 file. Nothing else in the toolkit imports them.
output = ["h5py>=3.8", "numpy>=1.24", "h5netcdf>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
openghm = "openghm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openghm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "hatch_build.py"]

# Fails the build with an actionable message when src/openghm/schemas (a symlink
# to the repository's schemas/) dangles, as it does under pip < 21.3's
# copy-then-build. See hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
